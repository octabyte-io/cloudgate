<!doctype html>
<html lang="en" data-theme="light" data-rail="1" data-drawer="0" data-paused="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudgate — console (direction E)</title>
<style>
/* ============================================================
   Cloudgate — direction E, "console".

   THE DIRECTION
   A control plane, not a canvas and not a NOC wall. Directions A–D
   all answer the brief with atmosphere: dim the room, add telemetry,
   make the surface feel like equipment. E argues the other side —
   that a console earns the feeling of operating infrastructure by
   being *navigable at scale*, and that legibility is the thing you
   are actually buying when you look at real infrastructure UI all
   day. The reference is the Cloudflare dashboard, read from the
   live product, and the borrowing is structural rather than
   cosmetic. See { notes } (avatar menu → Design notes) for the
   argument in full, including where it disagrees with BRIEF.md.

   THE SIGNATURE
   The rail is a SCOPE, not a menu. Entering a server, an
   environment or a service replaces the whole rail with that
   resource's own navigation, drops a "Back to …" pill above it,
   and rewrites the masthead to the resource's identity. Rail depth
   tracks Organization → Project → Environment → services, which is
   exactly the hierarchy BRIEF.md asks these screens to express. No
   other direction in the set does this; all four run one flat rail
   across every view.
   Second signature, and it genuinely works: ⌘K with typed prefixes
   (srv: svc: env: dep: run: acct: go:) filtering the real data.

   TOKEN ROLES — read them as roles, not as colours.
     --ground   the page behind everything
     --panel    a raised surface (card, rail, masthead)
     --panel-2  an inset strip inside a surface (table head, meta)
     --raise    hover and selected fills
     --line     hairline; --line-2 a deliberate emphasis rule
     --tx       primary text        (>= 4.5:1 on panel, both themes)
     --tx-2     secondary text      (>= 4.5:1 on panel, both themes)
     --tx-3     labels, axis ticks  (>= 4.5:1 on panel, both themes)
     --tx-4     DECORATION ONLY — never carries meaning
     --accent   THE accent, as a fill
     --accent-tx  the accent as text or a 1px rule, lifted for contrast
     --ok --warn --bad --info  status, always paired with a word

   The neutral ramp is lifted from the product's own
   frontend/src/app/globals.css rather than measured off the
   reference — the real app already ships this shadcn scale, and
   so, as it turns out, does Cloudflare.

   The accent is the one invented value: the product has no brand
   hue yet (globals.css is entirely achromatic apart from one
   sidebar token at hue 264). E proposes hue 285, held ~25° off the
   reference's blue so the two do not read as the same product.
   Marked as a proposal in the notes drawer.

   Both palettes ship. The switch is under the avatar menu →
   Appearance, where the reference keeps it. Opens LIGHT, which is
   the point: fifteen prototypes already open dark.
   ============================================================ */

:root{
  /* ---- geometry, measured off the reference ---- */
  --top:56px;          /* masthead */
  --rail:259px;        /* rail, expanded */
  --rail-c:60px;       /* rail, collapsed to an icon strip */
  --aside:336px;       /* right rail */
  --col:1360px;        /* page measure */
  --ctl:36px;          /* control height */
  --nav:34px;          /* rail item height */
  --row:40px;          /* table row height */
  --r:8px; --r-sm:6px; --r-lg:12px; --r-pill:999px;
  --pad:32px;

  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", "Courier New", monospace;

  /* ---- type scale ---- */
  --t-disp:30px;   /* page title, 600, -0.16px  */
  --t-sect:20px;   /* section heading, 600      */
  --t-lead:16px;   /* lede                      */
  --t-body:14px;   /* body and every control    */
  --t-ui:13px;     /* rail items and table cells*/
  --t-meta:12px;   /* meta and captions         */
  --t-chip:11px;   /* mono chips and badges     */
}

/* ---------- LIGHT (default) ---------- */
:root, html[data-theme="light"]{
  --ground:oklch(0.9875 0 0);
  --panel:#fff;
  --panel-2:oklch(0.982 0 0);
  --raise:oklch(0.965 0 0);
  --raise-2:oklch(0.935 0 0);
  --line:oklch(0.922 0 0);
  --line-2:oklch(0.86 0 0);
  --tx:oklch(0.205 0 0);
  --tx-2:oklch(0.44 0 0);
  --tx-3:oklch(0.49 0 0);
  --tx-4:oklch(0.68 0 0);

  --accent:oklch(0.53 0.2 285);
  --accent-hi:oklch(0.47 0.2 285);
  --accent-ring:oklch(0.44 0.19 285);
  --accent-tx:oklch(0.47 0.2 285);
  --accent-tint:oklch(0.968 0.017 285);
  --accent-line:oklch(0.86 0.06 285);

  --ok:oklch(0.47 0.13 155);   --ok-tint:oklch(0.965 0.03 155);   --ok-line:oklch(0.86 0.07 155);
  --warn:oklch(0.51 0.12 68);  --warn-tint:oklch(0.968 0.045 78); --warn-line:oklch(0.85 0.09 75);
  --bad:oklch(0.52 0.2 27);    --bad-tint:oklch(0.968 0.028 27);  --bad-line:oklch(0.87 0.07 27);
  --info:var(--accent-tx);     --info-tint:var(--accent-tint);    --info-line:var(--accent-line);

  --shadow:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-2:0 1px 3px 0 rgb(0 0 0 / .07), 0 1px 2px -1px rgb(0 0 0 / .07);
  --pop:0 12px 32px -10px rgb(0 0 0 / .2), 0 3px 8px -3px rgb(0 0 0 / .1);
  --scrim:rgb(0 0 0 / .34);
  --well:oklch(0.978 0 0);
  --well-tx:oklch(0.29 0 0);
  --hatch:oklch(0.9 0 0);
}

/* ---------- DARK ---------- */
html[data-theme="dark"]{
  --ground:oklch(0.178 0 0);
  --panel:oklch(0.216 0 0);
  --panel-2:oklch(0.245 0 0);
  --raise:oklch(0.275 0 0);
  --raise-2:oklch(0.32 0 0);
  --line:oklch(0.302 0 0);
  --line-2:oklch(0.4 0 0);
  --tx:oklch(0.97 0 0);
  --tx-2:oklch(0.775 0 0);
  --tx-3:oklch(0.695 0 0);
  --tx-4:oklch(0.5 0 0);

  /* L 0.555 rather than 0.585: white-on-primary lands at 4.50 exactly at
     0.585, and a value sitting on the threshold is a value that fails the
     first time anything nudges it. */
  --accent:oklch(0.555 0.2 285);
  --accent-hi:oklch(0.625 0.2 285);
  --accent-ring:oklch(0.7 0.16 285);
  --accent-tx:oklch(0.8 0.14 285);
  --accent-tint:oklch(0.28 0.06 285);
  --accent-line:oklch(0.42 0.11 285);

  --ok:oklch(0.79 0.15 158);   --ok-tint:oklch(0.27 0.05 158);   --ok-line:oklch(0.4 0.08 158);
  --warn:oklch(0.83 0.14 80);  --warn-tint:oklch(0.28 0.05 78);  --warn-line:oklch(0.42 0.08 78);
  --bad:oklch(0.72 0.18 25);   --bad-tint:oklch(0.29 0.07 25);   --bad-line:oklch(0.44 0.11 25);
  --info:var(--accent-tx);     --info-tint:var(--accent-tint);   --info-line:var(--accent-line);

  --shadow:0 1px 2px 0 rgb(0 0 0 / .3);
  --shadow-2:0 1px 3px 0 rgb(0 0 0 / .4), 0 1px 2px -1px rgb(0 0 0 / .3);
  --pop:0 16px 40px -12px rgb(0 0 0 / .7), 0 4px 10px -4px rgb(0 0 0 / .5);
  --scrim:rgb(0 0 0 / .6);
  /* A rack in a lit room still has black displays: log wells and the
     run console stay near-black in BOTH themes. This is the only place
     the light palette borrows from the dark one. */
  --well:oklch(0.19 0 0);
  --well-tx:oklch(0.9 0 0);
  --hatch:oklch(0.34 0 0);
}

/* ============================================================
   base
   ============================================================ */

*,*::before,*::after{ box-sizing:border-box }
html,body{ margin:0; padding:0 }
/* overflow:hidden on BOTH — a visually-hidden .sr span is positioned
   absolutely, and without a positioned ancestor it lands in the initial
   containing block and quietly extends the document's scroll width. The
   real fix is the position:relative on table cells further down; this is
   the belt to go with those braces. */
html{ -webkit-text-size-adjust:100%; background:var(--ground); overflow:hidden }
body{
  font:400 var(--t-body)/1.5 var(--sans);
  color:var(--tx); background:var(--ground);
  overflow:hidden;                     /* the two scroll regions own scrolling */
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol,figure{ margin:0 }
ul,ol{ padding:0; list-style:none }
button{ font:inherit; color:inherit; background:none; border:0; margin:0; padding:0; cursor:pointer }
a{ color:var(--accent-tx); text-decoration:none }
a:hover{ text-decoration:underline }
code,kbd,samp,pre{ font-family:var(--mono); font-size:.92em }
table{ border-collapse:collapse; border-spacing:0 }
svg{ display:block; flex:none }
:focus-visible{ outline:2px solid var(--accent-ring); outline-offset:2px; border-radius:var(--r-sm) }
.sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.skip{
  position:fixed; left:-9999px; top:8px; z-index:90;
  background:var(--panel); color:var(--tx); border:1px solid var(--line);
  border-radius:var(--r); padding:9px 14px; box-shadow:var(--pop);
}
.skip:focus{ left:8px }
.mono{ font-family:var(--mono) }
.num{ font-variant-numeric:tabular-nums }

/* ============================================================
   masthead
   ============================================================ */

/* minmax(0,1fr), not the default auto: an auto grid column cannot shrink
   below its items' min-content, and the masthead's min-content is wider
   than a phone. This one declaration is what keeps 380px honest. */
.app{
  height:100vh; height:100dvh; display:grid;
  grid-template-rows:var(--top) 1fr; grid-template-columns:minmax(0,1fr);
}

.top{
  display:flex; align-items:stretch; min-width:0;
  background:var(--panel); border-bottom:1px solid var(--line);
  position:relative; z-index:30;
}
.orgcell{
  width:var(--rail); flex:none; display:flex; align-items:center; gap:8px; min-width:0;
  padding:0 12px 0 16px; border-right:1px solid var(--line);
  transition:width .16s ease;
}
.mark{ display:flex; align-items:center; gap:8px; flex:none; border-radius:var(--r-sm) }
.mark .glyph{ color:var(--accent-tx) }
.mark b{
  font:650 15px/1 var(--sans); letter-spacing:-.28px; color:var(--tx);
}
.orgsw{
  display:flex; align-items:center; gap:6px; min-width:0; flex:1 1 auto;
  height:30px; padding:0 6px; border-radius:var(--r-sm); color:var(--tx);
  font:500 var(--t-ui)/1 var(--sans);
}
.orgsw:hover{ background:var(--raise) }
.orgsw .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.orgsw .ch{ color:var(--tx-3); flex:none }

.ctx{
  flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
  padding:0 16px;
}
/* The reference fades a breadcrumb into the masthead once the page
   scrolls. Only at organization scope — a resource scope already has
   its identity up here permanently. */
.crumb{
  display:flex; align-items:center; gap:7px; min-width:0;
  color:var(--tx-2); font:500 var(--t-ui)/1 var(--sans);
  opacity:0; transform:translateY(3px); transition:opacity .18s ease, transform .18s ease;
  pointer-events:none;
}
.crumb.on{ opacity:1; transform:none; pointer-events:auto }
.crumb .sep{ color:var(--tx-4) }
.crumb b{ color:var(--tx); font-weight:600 }

.ident{ display:flex; align-items:center; gap:9px; min-width:0; flex:1 1 auto }
.ident .star{
  width:26px; height:26px; display:grid; place-items:center; flex:none;
  border-radius:var(--r-sm); color:var(--tx-3);
}
.ident .star:hover{ background:var(--raise); color:var(--tx) }
.ident .star[data-on="1"]{ color:var(--warn) }
.ident .nm{
  font:600 var(--t-body)/1 var(--sans); color:var(--tx);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  min-width:0; flex:0 1 auto;
}
.idbadge{ display:flex; align-items:center; gap:7px; flex:none }
.ident .path{ color:var(--tx-3); font-weight:500 }
.identsw{
  width:22px; height:26px; display:grid; place-items:center; flex:none;
  border-radius:var(--r-sm); color:var(--tx-3);
}
.identsw:hover{ background:var(--raise); color:var(--tx) }

.topacts{ display:flex; align-items:center; gap:2px; padding:0 12px 0 8px; flex:none }
.topbtn{
  display:flex; align-items:center; gap:6px; height:32px; padding:0 10px;
  border-radius:var(--r-sm); color:var(--tx-2); font:500 var(--t-ui)/1 var(--sans);
}
.topbtn:hover{ background:var(--raise); color:var(--tx) }
.avatar{
  width:30px; height:30px; display:grid; place-items:center; border-radius:var(--r-pill);
  background:var(--raise); color:var(--tx-2); border:1px solid transparent;
}
.avatar:hover{ background:var(--raise-2); color:var(--tx) }
.avatar[aria-expanded="true"]{ border-color:var(--accent-ring); color:var(--tx) }

/* ============================================================
   rail
   ============================================================ */

.body{ display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:0; min-width:0 }
html[data-rail="0"]{ --rail:var(--rail-c) }

.rail{
  display:flex; flex-direction:column; min-height:0;
  background:var(--panel); border-right:1px solid var(--line);
  position:relative; z-index:20;
}
.railtop{ padding:14px 16px 8px; flex:none }
.qs{
  display:flex; align-items:center; gap:8px; width:100%; height:var(--ctl);
  padding:0 8px 0 10px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--panel); color:var(--tx-3); font:400 var(--t-body)/1 var(--sans);
  box-shadow:var(--shadow);
}
.qs:hover{ border-color:var(--line-2); color:var(--tx-2) }
.qs .lb{ flex:1 1 auto; text-align:left }
.qs kbd{
  font:500 var(--t-chip)/1 var(--sans); color:var(--tx-3);
  border:1px solid var(--line); border-radius:5px; padding:3px 5px; background:var(--panel-2);
}
html[data-rail="0"] .railtop{ padding:14px 10px 8px }
html[data-rail="0"] .qs{ justify-content:center; padding:0 }
html[data-rail="0"] .qs .lb,
html[data-rail="0"] .qs kbd{ display:none }

.railscroll{ flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:0 12px 8px }
.railscroll::-webkit-scrollbar{ width:10px }
.railscroll::-webkit-scrollbar-thumb{ background:var(--raise-2); border:3px solid var(--panel); border-radius:99px }

/* "Back to …" — the scope-exit pill. Only rendered off organization scope. */
.backto{
  display:flex; align-items:center; gap:8px; width:100%; height:var(--nav);
  padding:0 10px; border-radius:var(--r); margin:2px 0 10px;
  background:var(--raise); color:var(--tx); font:500 var(--t-ui)/1 var(--sans);
}
.backto:hover{ background:var(--raise-2) }
.backto svg{ color:var(--tx-3) }
.railrule{ height:1px; background:var(--line); margin:2px -12px 10px }

.navgrp{ margin:0 0 2px }
/* Sentence case, muted, 13px — the reference does NOT shout its
   group labels, and uppercasing them is the fastest way to look
   like a different product. */
.navlab{
  font:500 var(--t-ui)/1 var(--sans); color:var(--tx-3);
  letter-spacing:-.16px; padding:14px 10px 6px;
}
.navi{
  display:flex; align-items:center; gap:10px; width:100%; height:var(--nav);
  padding:0 10px; border-radius:var(--r); color:var(--tx);
  font:500 var(--t-ui)/1 var(--sans); letter-spacing:-.08px; text-align:left;
  position:relative;
}
.navi:hover{ background:var(--raise); text-decoration:none }
.navi[aria-current="page"]{ background:var(--raise) }
.navi[aria-current="page"] .lb{ font-weight:600 }
.navi > svg:first-child{ color:var(--tx-3); flex:none }
.navi[aria-current="page"] > svg:first-child{ color:var(--accent-tx) }
.navi .lb{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.navi .ch{ color:var(--tx-4); flex:none; transition:transform .15s ease }
.navi[aria-expanded="true"] .ch{ transform:rotate(90deg) }
.navi .tag{
  font:500 var(--t-chip)/1 var(--sans); color:var(--tx-3); flex:none;
  border:1px solid var(--line); border-radius:5px; padding:3px 5px; background:var(--panel-2);
}
/* Sub-items hang under a hairline, indented to the parent's label. */
.navsub{ margin:2px 0 4px; padding-left:19px; border-left:1px solid var(--line); margin-left:11px }
.navsub .navi{ height:32px; padding-left:10px }
.navsub .navi > svg:first-child{ display:none }

html[data-rail="0"] .navlab{
  height:1px; padding:0; margin:12px 6px 8px; overflow:hidden;
  background:var(--line); color:transparent;
}
html[data-rail="0"] .navi{ justify-content:center; padding:0 }
html[data-rail="0"] .navi .lb,
html[data-rail="0"] .navi .ch,
html[data-rail="0"] .navi .tag{ display:none }
/* Collapsed, a group's children would be a column of identical chevrons
   carrying no information — so they are hidden outright and the group's
   own icon is the whole affordance. */
html[data-rail="0"] .navsub{ display:none }
html[data-rail="0"] .backto .lb{ display:none }
html[data-rail="0"] .backto{ justify-content:center; padding:0 }

.railfoot{
  flex:none; border-top:1px solid var(--line); padding:8px 12px;
  display:flex; align-items:center; gap:6px;
}
.railfoot .flex{ flex:1 1 auto }
.iconbtn{
  width:30px; height:30px; display:grid; place-items:center; flex:none;
  border-radius:var(--r-sm); color:var(--tx-3);
}
.iconbtn:hover{ background:var(--raise); color:var(--tx) }
.iconbtn[data-on="1"]{ color:var(--accent-tx) }

/* off-canvas scrim, drawer widths only */
.scrim{
  position:fixed; inset:0; z-index:19; background:var(--scrim);
  opacity:0; pointer-events:none; transition:opacity .18s ease; border:0;
}

/* ============================================================
   page
   ============================================================ */

.main{ min-width:0; min-height:0; overflow-y:auto; overflow-x:hidden; background:var(--ground) }
.page{ max-width:var(--col); margin:0 auto; padding:26px var(--pad) 72px }

.phead{ display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap; margin:0 0 22px }
.phead .txt{ flex:1 1 340px; min-width:0 }
.phead h1{
  display:flex; align-items:center; gap:11px;
  font:600 var(--t-disp)/1.16 var(--sans); letter-spacing:-.16px; color:var(--tx);
}
.phead h1 svg{ color:var(--tx-2) }
.phead .sub{ color:var(--tx-2); font-size:var(--t-body); margin-top:7px; max-width:74ch }
/* A strap inside a page subtitle is a second, quieter sentence — it gets
   its own line rather than running on at a smaller size mid-paragraph. */
.phead .sub .strap{ display:block; margin-top:5px }
.phead .acts{ display:flex; align-items:center; gap:8px; flex:none; flex-wrap:wrap; padding-top:4px }

.cols{ display:grid; grid-template-columns:minmax(0,1fr) var(--aside); gap:26px; align-items:start }
.cols.wide{ grid-template-columns:minmax(0,1fr) }
.mcol,.acol{ min-width:0; display:flex; flex-direction:column; gap:18px }

.sect{ font:600 var(--t-sect)/1.25 var(--sans); letter-spacing:-.2px; color:var(--tx) }
.sechd{ display:flex; align-items:center; gap:12px; flex-wrap:wrap }
.sechd .flex{ flex:1 1 auto }
.lede{ color:var(--tx-2); font-size:var(--t-body) }
.strap{ color:var(--tx-2); font-size:var(--t-meta) }
.strap code{ color:var(--tx); background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:1px 4px }

/* ============================================================
   controls
   ============================================================ */

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:var(--ctl); padding:0 13px; border-radius:var(--r);
  font:500 var(--t-body)/1 var(--sans); white-space:nowrap;
  border:1px solid transparent; background:var(--panel); color:var(--tx);
  box-shadow:var(--shadow); transition:background .12s ease, border-color .12s ease;
}
.btn:hover{ text-decoration:none }
.btn.sm{ height:30px; padding:0 10px; font-size:var(--t-ui) }
.btn.xs{ height:26px; padding:0 8px; font-size:var(--t-chip) }
.btn.gh{ border-color:var(--line); color:var(--tx) }
.btn.gh:hover{ background:var(--raise); border-color:var(--line-2) }
.btn.pri{
  background:var(--accent); color:#fff; border-color:transparent;
  box-shadow:inset 0 0 0 1px var(--accent-ring), var(--shadow);
}
.btn.pri:hover{ background:var(--accent-hi) }
.btn.qt{ box-shadow:none; background:transparent; color:var(--tx-2) }
.btn.qt:hover{ background:var(--raise); color:var(--tx) }
.btn.dngr{ border-color:var(--bad-line); color:var(--bad); background:var(--panel) }
.btn.dngr:hover{ background:var(--bad-tint) }
.btn svg{ margin-inline:-1px }

.inp{
  height:var(--ctl); width:100%; padding:0 11px; border-radius:var(--r);
  border:1px solid var(--line); background:var(--panel); color:var(--tx);
  font:400 var(--t-body)/1 var(--sans); box-shadow:var(--shadow);
}
.inp::placeholder{ color:var(--tx-3) }
.inp:focus-visible{ outline:2px solid var(--accent-ring); outline-offset:-1px }
.srch{ position:relative; flex:1 1 220px; min-width:0 }
.srch > svg{ position:absolute; left:11px; top:50%; margin-top:-8px; color:var(--tx-3); pointer-events:none }
.srch .inp{ padding-left:34px }
.bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap }

.seg{
  display:inline-flex; padding:3px; gap:2px; border-radius:var(--r);
  background:var(--panel-2); border:1px solid var(--line);
}
.seg button{
  height:28px; padding:0 11px; border-radius:var(--r-sm); color:var(--tx-2);
  font:500 var(--t-ui)/1 var(--sans); white-space:nowrap;
}
.seg button:hover{ color:var(--tx) }
.seg button[aria-pressed="true"]{ background:var(--panel); color:var(--tx); box-shadow:var(--shadow-2) }

.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none }
.tabs::-webkit-scrollbar{ display:none }
.tabs button{
  height:38px; padding:0 12px; color:var(--tx-2); white-space:nowrap;
  font:500 var(--t-body)/1 var(--sans); border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button:hover{ color:var(--tx) }
.tabs button[aria-pressed="true"]{ color:var(--tx); border-bottom-color:var(--accent) }

.sw{
  width:38px; height:22px; flex:none; border-radius:var(--r-pill); position:relative;
  background:var(--raise-2); border:1px solid var(--line); transition:background .15s ease;
}
.sw::after{
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
  border-radius:var(--r-pill); background:var(--panel); box-shadow:var(--shadow-2);
  transition:transform .15s ease;
}
.sw[aria-pressed="true"]{ background:var(--accent); border-color:transparent }
.sw[aria-pressed="true"]::after{ transform:translateX(16px) }

/* One rule, keyed on the attribute markInert() sets, so "this control
   is inert" and "this control looks inert" cannot drift apart. */
[aria-disabled="true"]{ cursor:not-allowed; color:var(--tx-3) }
button[aria-disabled="true"]:hover{ background:var(--panel) }
.btn[aria-disabled="true"]{ color:var(--tx-3); border-color:var(--line); box-shadow:none; background:var(--panel-2) }
.btn.pri[aria-disabled="true"]{ background:var(--panel-2); color:var(--tx-3) }
.sw[aria-disabled="true"]{ opacity:.5 }

/* ============================================================
   surfaces
   ============================================================ */

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow); overflow:hidden;
}
.card > .hd{
  display:flex; align-items:center; gap:10px; padding:13px 16px;
  border-bottom:1px solid var(--line);
}
.card > .hd .flex{ flex:1 1 auto; min-width:0 }
.card > .hd h3{ font:600 var(--t-body)/1.3 var(--sans); color:var(--tx) }
.card > .hd .sub{ color:var(--tx-3); font-size:var(--t-meta); margin-top:2px }
.card > .bd{ padding:16px; position:relative }
.card > .bd.flush{ padding:0 }
.card > .ft{
  padding:11px 16px; border-top:1px solid var(--line); background:var(--panel-2);
  color:var(--tx-2); font-size:var(--t-meta);
}
.card.plain{ box-shadow:none }

/* the strip the reference puts above a table, inside the card */
.meta{
  padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel-2);
  color:var(--tx-2); font-size:var(--t-ui);
}
.meta b{ color:var(--tx); font-weight:600 }

.banner{ border:1px solid var(--line); border-radius:var(--r-lg); background:var(--panel); overflow:hidden }
.banner > .hd{
  display:flex; align-items:center; gap:9px; padding:11px 16px; width:100%;
  font:500 var(--t-body)/1 var(--sans); color:var(--tx); text-align:left;
}
.banner > .hd .flex{ flex:1 1 auto }
.banner > .hd:hover{ background:var(--panel-2) }
.banner .count{
  display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px;
  border-radius:var(--r-pill); background:var(--accent); color:#fff;
  font:600 var(--t-chip)/1 var(--sans);
}
.banner > .bd{ border-top:1px solid var(--line); padding:4px 0 }
.brow{ display:flex; gap:11px; padding:11px 16px }
.brow .bullet{ flex:none; margin-top:5px }
.brow .bullet::before{
  content:""; display:block; width:8px; height:8px; border-radius:var(--r-pill);
  background:var(--accent);
}
.brow[data-t="warn"] .bullet::before{ background:var(--warn) }
.brow[data-t="bad"] .bullet::before{ background:var(--bad) }
/* overflow-wrap:anywhere because the copy here is real infrastructure
   prose and contains unbreakable tokens — Microsoft.Compute/virtualMachines,
   resource addresses, role ARNs. Without it a long token walks straight
   out from under the action button on a phone. */
.brow .t{ font:600 var(--t-body)/1.4 var(--sans); color:var(--tx); overflow-wrap:anywhere }
.brow .d{ color:var(--tx-2); font-size:var(--t-body); margin-top:2px; overflow-wrap:anywhere }
.brow .go{ flex:none; align-self:center }
.lede,.strap,.qa .d,.qa .t,.pick .d,.notes li,.notes p{ overflow-wrap:anywhere }

/* ============================================================
   status
   ============================================================ */

.pill{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px 0 6px;
  border-radius:var(--r-pill); font:500 var(--t-chip)/1 var(--sans); white-space:nowrap;
  border:1px solid var(--line); background:var(--panel-2); color:var(--tx-2);
}
.pill .g{ font-size:9px; line-height:1 }
.pill.t-ok{ color:var(--ok); background:var(--ok-tint); border-color:var(--ok-line) }
.pill.t-warn{ color:var(--warn); background:var(--warn-tint); border-color:var(--warn-line) }
.pill.t-bad{ color:var(--bad); background:var(--bad-tint); border-color:var(--bad-line) }
.pill.t-info{ color:var(--info); background:var(--info-tint); border-color:var(--info-line) }
.pill.t-mute{ color:var(--tx-3) }
.pill sup.prop{
  font:600 9px/1 var(--sans); margin-left:1px; padding:1px 3px; border-radius:3px;
  background:var(--panel); border:1px solid currentColor; vertical-align:top;
}
.chip{
  display:inline-flex; align-items:center; gap:5px; height:21px; padding:0 7px;
  border-radius:var(--r-sm); border:1px solid var(--line); background:var(--panel-2);
  color:var(--tx-2); font:500 var(--t-chip)/1 var(--sans); white-space:nowrap;
}
.chip.mono{ font-family:var(--mono); letter-spacing:-.2px }
.chip.acc{ color:var(--accent-tx); border-color:var(--accent-line); background:var(--accent-tint) }
.pv{
  display:inline-grid; place-items:center; min-width:30px; height:20px; padding:0 5px;
  border-radius:5px; font:600 10px/1 var(--mono); letter-spacing:.02em;
  border:1px solid var(--line); background:var(--panel-2); color:var(--tx-2);
}
.dot{ display:inline-block; width:8px; height:8px; border-radius:var(--r-pill); background:var(--tx-4) }
.dot[data-s="active"],.dot[data-s="running"],.dot[data-s="done"],
.dot[data-s="connected"],.dot[data-s="ready"]{ background:var(--ok) }
.dot[data-s="building"],.dot[data-s="provisioning"],
.dot[data-s="pending"],.dot[data-s="attention"]{ background:var(--warn) }
.dot[data-s="error"],.dot[data-s="unreachable"]{ background:var(--bad) }
.dot[data-s="drift"],.dot[data-s="planned"]{ background:var(--accent) }

/* ============================================================
   data table
   ============================================================ */

.twrap{ overflow-x:auto; overscroll-behavior-x:contain }
.dt{ width:100%; font-size:var(--t-ui) }
/* position:relative so a visually-hidden .sr label inside a cell has a
   containing block here rather than in the viewport. */
.dt th,.dt td{ text-align:left; padding:0 12px; height:var(--row); white-space:nowrap; position:relative }
.dt thead th{
  background:var(--panel-2); border-bottom:1px solid var(--line);
  font:600 var(--t-ui)/1 var(--sans); color:var(--tx-2); height:38px;
}
.dt thead th .hcell{ display:flex; align-items:center; gap:5px }
.dt thead th svg{ color:var(--tx-4) }
.dt tbody tr{ border-bottom:1px solid var(--line) }
.dt tbody tr:last-child{ border-bottom:0 }
.dt tbody tr:hover{ background:var(--panel-2) }
.dt tbody tr[aria-selected="true"]{ background:var(--accent-tint) }
.dt td{ color:var(--tx-2) }
.dt td.k{ color:var(--tx); font-weight:500 }
.dt td.r{ text-align:right }
.dt td .sub{ color:var(--tx-3) }
.dt td.wrap{ white-space:normal; min-width:220px }
.dt .lk{ color:var(--accent-tx); font-weight:500 }
.dt .lk:hover{ text-decoration:underline }
.dt .cx{ width:34px; padding-right:0 }
.dt .px{ width:30px; padding-inline:0 }
.dt .em{ color:var(--tx-3) }
.dt tbody tr[aria-disabled="true"] td.k{ color:var(--tx-3) }
.cbox{
  width:15px; height:15px; border-radius:4px; border:1px solid var(--line-2);
  background:var(--panel); display:grid; place-items:center; color:transparent;
}
.cbox[aria-pressed="true"]{ background:var(--accent); border-color:transparent; color:#fff }
.pager{
  display:flex; align-items:center; gap:10px; padding:11px 16px;
  border-top:1px solid var(--line); color:var(--tx-2); font-size:var(--t-meta);
}
.pager b{ color:var(--tx); font-weight:600 }
.pager .flex{ flex:1 1 auto }

/* ============================================================
   right-rail furniture
   ============================================================ */

.meter{ height:6px; border-radius:var(--r-pill); background:var(--raise-2); overflow:hidden }
.meter > i{ display:block; height:100%; background:var(--accent); border-radius:inherit; transition:width .3s ease }
.meter[data-tone="warn"] > i{ background:var(--warn) }
.meter[data-tone="alarm"] > i{ background:var(--bad) }
.meter[data-tone="mute"] > i{ background:var(--tx-4) }
/* The run's per-resource ribbon: one segment per Terraform resource,
   filled as each one finishes. The smooth meter above it is the same
   number; this is the one that shows you *which* resource is running. */
[data-segs]{ display:flex; gap:3px }
[data-segs] > span{
  flex:1 1 0; height:4px; border-radius:2px; background:var(--raise-2);
  transition:background .2s ease;
}
[data-segs] > span.on{ background:var(--ok) }
[data-segs] > span.now{ background:var(--warn) }

/* A total split by its parts, rather than a total against an invented
   quota. One tint per provider, and every segment carries its own title. */
.split{ display:flex; gap:2px; height:8px; border-radius:var(--r-pill); overflow:hidden; background:var(--raise-2) }
.split > i{ display:block; height:100%; background:var(--accent); border-radius:2px }
.split > i[data-p="gcp"]{ background:oklch(0.62 0.15 250) }
.split > i[data-p="azure"]{ background:oklch(0.66 0.13 220) }
html[data-theme="dark"] .split > i[data-p="gcp"]{ background:oklch(0.7 0.14 250) }
html[data-theme="dark"] .split > i[data-p="azure"]{ background:oklch(0.74 0.12 220) }
.mline{ display:flex; align-items:baseline; gap:8px; font-size:var(--t-ui); margin-bottom:7px }
.mline .lb{ color:var(--tx-2); flex:1 1 auto; min-width:0 }
.mline .vl{ color:var(--tx); font-weight:500 }

.stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
.stat{ border:1px solid var(--line); border-radius:var(--r); padding:11px 12px; background:var(--panel) }
.stat .lb{ display:flex; align-items:center; gap:4px; color:var(--tx-3); font-size:var(--t-meta) }
.stat .vl{ font:600 22px/1.15 var(--sans); letter-spacing:-.3px; color:var(--tx); margin-top:6px }
.stat .vl small{ font:500 var(--t-meta)/1 var(--sans); color:var(--tx-3); margin-left:3px }
.stat .dl{ color:var(--tx-3); font-size:var(--t-meta); margin-top:3px }
.stat.wide{ grid-column:1/-1 }

.kv{ display:flex; flex-direction:column }
.kv > .r{
  display:flex; align-items:center; gap:10px; padding:10px 0;
  border-bottom:1px solid var(--line); font-size:var(--t-ui);
}
.kv > .r:last-child{ border-bottom:0 }
.kv .k{ color:var(--tx-2); flex:none }
.kv .v{
  flex:1 1 auto; min-width:0; text-align:right; color:var(--tx);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.kv .v.mono{ font-size:var(--t-meta); letter-spacing:-.2px }
.kv .act{ flex:none; color:var(--tx-3) }

.qa{ display:flex; flex-direction:column }
.qa > .r{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line) }
.qa > .r:last-child{ border-bottom:0 }
.qa .txt{ flex:1 1 auto; min-width:0 }
.qa .t{ font:500 var(--t-body)/1.3 var(--sans); color:var(--tx); display:flex; align-items:center; gap:7px; flex-wrap:wrap }
.qa .d{ color:var(--tx-2); font-size:var(--t-meta); margin-top:3px }
.qa .lk{ display:inline-flex; align-items:center; gap:4px; font-size:var(--t-meta); margin-top:5px }

/* ============================================================
   charts
   ============================================================ */

.chart{ display:flex; gap:18px; align-items:stretch }
.chart .side{ flex:none; width:118px; padding:2px 0 }
.chart .side .lb{ color:var(--tx-2); font-size:var(--t-ui) }
.chart .side .vl{ font:600 26px/1.15 var(--sans); letter-spacing:-.4px; color:var(--tx); margin-top:5px }
.chart .side .vl small{ font:500 var(--t-meta)/1 var(--sans); color:var(--tx-3); margin-left:3px }
.chart .side .dl{ color:var(--tx-3); font-size:var(--t-meta); margin-top:4px }
.chart .plot{ flex:1 1 auto; min-width:0 }
.plot .frame{ position:relative; height:96px }
.plot svg{ width:100%; height:100%; overflow:visible }
/* non-scaling-stroke because preserveAspectRatio="none" stretches the
   viewBox: without it the dashes and the line weight distort with the
   width of the panel. */
.plot .grid line{
  stroke:var(--line); stroke-width:1; stroke-dasharray:3 4;
  vector-effect:non-scaling-stroke;
}
.plot .ax{ font:400 10px/1 var(--sans); fill:var(--tx-3) }
.plot .ar{ fill:var(--accent); opacity:.1; stroke:none }
.plot .ln{
  fill:none; stroke:var(--accent); stroke-width:1.5;
  stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke;
}
.plot.hot .ln{ stroke:var(--bad) } .plot.hot .ar{ fill:var(--bad) }
.plot.mute .ln{ stroke:var(--tx-4) } .plot.mute .ar{ fill:var(--tx-4); opacity:.06 }
.plot .ticks{
  display:flex; justify-content:space-between; color:var(--tx-3);
  font-size:10px; margin-top:7px;
}
.spk{ width:100%; height:30px; overflow:visible }
.spk .ln{ fill:none; stroke:var(--accent); stroke-width:1.4; vector-effect:non-scaling-stroke }
.spk .ar{ fill:var(--accent); opacity:.11; stroke:none }
.spk .gd{ stroke:var(--line); stroke-width:1; stroke-dasharray:2 3; fill:none }
.spk.hot .ln{ stroke:var(--bad) } .spk.hot .ar{ fill:var(--bad) }
.spk.dead .ln{ stroke:var(--bad); stroke-dasharray:2 3 } .spk.dead .ar{ fill:none }
.spk.mute .ln{ stroke:var(--tx-4) } .spk.mute .ar{ fill:none }

/* ============================================================
   log wells and diffs
   ============================================================ */

.well{
  background:var(--well); border:1px solid var(--line); border-radius:var(--r);
  color:var(--well-tx); font:400 var(--t-meta)/1.62 var(--mono);
  padding:12px 14px; max-height:340px; overflow:auto;
}
html[data-theme="light"] .well{ border-color:var(--line) }
html[data-theme="dark"] .well{ border-color:oklch(0.28 0 0) }
.well .ln{ display:flex; gap:12px; white-space:pre-wrap; word-break:break-word }
.well .ts{ flex:none; color:var(--tx-4); font-variant-numeric:tabular-nums }
html[data-theme="light"] .well .ts{ color:oklch(0.62 0 0) }
.well .tx{ flex:1 1 auto; min-width:0 }
.well .ln[data-t="ok"] .tx{ color:var(--ok) }
.well .ln[data-t="warn"] .tx{ color:var(--warn) }
.well .ln[data-t="bad"] .tx{ color:var(--bad) }
.well .ln[data-t="hl"] .tx{ color:var(--accent-tx); font-weight:500 }
.well .ln[data-t="dim"] .tx{ opacity:.62 }
.well .cur{
  display:inline-block; width:7px; height:13px; background:var(--accent-tx);
  vertical-align:-2px; animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{ 50%{ opacity:0 } }

.diff{
  border:1px solid var(--line); border-radius:var(--r); overflow:auto;
  background:var(--panel-2); font:400 var(--t-meta)/1.75 var(--mono);
}
.diff .ln{ display:flex; gap:0; white-space:pre }
.diff .g{
  flex:none; width:26px; text-align:center; color:var(--tx-3);
  border-right:1px solid var(--line); background:var(--panel);
}
.diff .tx{ padding:0 12px; flex:1 1 auto; min-width:0; color:var(--tx-2) }
.diff .ln[data-t="add"]{ background:var(--ok-tint) }
.diff .ln[data-t="add"] .g,.diff .ln[data-t="add"] .tx{ color:var(--ok) }
.diff .ln[data-t="del"]{ background:var(--bad-tint) }
.diff .ln[data-t="del"] .g,.diff .ln[data-t="del"] .tx{ color:var(--bad) }
.gut{ font-family:var(--mono); font-weight:600 }
.gut.g-add{ color:var(--ok) } .gut.g-del{ color:var(--bad) }
.gut.g-chg{ color:var(--warn) } .gut.g-noop{ color:var(--tx-3) }

/* ============================================================
   flows: stepper, radio cards, empty, skeleton
   ============================================================ */

.stepper{ display:flex; gap:0; flex-wrap:wrap; border:1px solid var(--line); border-radius:var(--r-lg); background:var(--panel); overflow:hidden }
.stepper button{
  display:flex; align-items:center; gap:9px; padding:13px 15px; flex:1 1 150px;
  border-right:1px solid var(--line); text-align:left; min-width:0;
}
.stepper button:last-child{ border-right:0 }
.stepper button:hover{ background:var(--panel-2) }
.stepper .n{
  width:22px; height:22px; flex:none; display:grid; place-items:center; border-radius:var(--r-pill);
  border:1px solid var(--line-2); color:var(--tx-3); font:600 var(--t-chip)/1 var(--sans);
}
.stepper .lb{ font:500 var(--t-ui)/1.3 var(--sans); color:var(--tx-2); min-width:0 }
.stepper button[data-st="done"] .n{ background:var(--ok); border-color:transparent; color:#fff }
.stepper button[data-st="done"] .lb{ color:var(--tx) }
.stepper button[aria-current="step"]{ background:var(--accent-tint) }
.stepper button[aria-current="step"] .n{ background:var(--accent); border-color:transparent; color:#fff }
.stepper button[aria-current="step"] .lb{ color:var(--tx); font-weight:600 }

.picks{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)) }
.pick{
  display:flex; flex-direction:column; align-items:flex-start; gap:7px; text-align:left;
  padding:14px; border:1px solid var(--line); border-radius:var(--r-lg);
  background:var(--panel); box-shadow:var(--shadow); min-width:0; width:100%;
}
.pick:hover{ border-color:var(--line-2) }
.pick[aria-pressed="true"]{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent), var(--shadow) }
.pick .top{ display:flex; align-items:center; gap:9px; width:100% }
.pick .t{ font:600 var(--t-body)/1.3 var(--sans); color:var(--tx); flex:1 1 auto; min-width:0 }
.pick .d{ color:var(--tx-2); font-size:var(--t-meta) }
.pick .m{ color:var(--tx-3); font-size:var(--t-meta); font-family:var(--mono) }
.pick[aria-disabled="true"]{ box-shadow:none }
.pick[aria-disabled="true"] .t{ color:var(--tx-3) }
.radio{
  width:16px; height:16px; flex:none; border-radius:var(--r-pill);
  border:1px solid var(--line-2); background:var(--panel);
}
.pick[aria-pressed="true"] .radio{ border:5px solid var(--accent) }

.empty{ display:grid; place-items:center; gap:9px; padding:56px 20px; text-align:center }
.empty svg{ color:var(--tx-4); margin-bottom:4px }
.empty h3{ font:600 20px/1.3 var(--sans); color:var(--tx) }
.empty p{ color:var(--tx-2); font-size:var(--t-body); max-width:46ch }

.skel{ background:var(--raise); border-radius:5px; height:11px; animation:pulse 1.6s ease-in-out infinite }
@keyframes pulse{ 50%{ opacity:.45 } }

/* ============================================================
   overlays: menu, palette, modal
   ============================================================ */

#overlay:empty{ display:none }
.pop{ position:fixed; inset:0; z-index:60 }
.pop > .catch{ position:absolute; inset:0; background:transparent; border:0; cursor:default; width:100%; height:100% }
.menu{
  position:absolute; min-width:214px; padding:6px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--pop);
}
/* .mi is a row, used both inside a menu and as a compact list row on a
   card. Kept unscoped so the two cannot drift apart. */
.mi{
  display:flex; align-items:center; gap:9px; width:100%; height:32px; padding:0 9px;
  border-radius:var(--r-sm); color:var(--tx); font:400 var(--t-body)/1 var(--sans); text-align:left;
}
.mi:hover{ background:var(--raise); text-decoration:none }
.mi .flex{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.mi .ch{ color:var(--tx-4); flex:none }
.mi > svg:first-child{ color:var(--tx-3) }
.mi[aria-pressed="true"]{ color:var(--accent-tx); font-weight:500 }
.mi.bad{ color:var(--bad) }
.menu .mi{ font-size:var(--t-body) }
.menu .sep{ height:1px; background:var(--line); margin:6px -6px }
.menu .lab{ padding:7px 9px 4px; color:var(--tx-3); font:500 var(--t-meta)/1 var(--sans) }

.modal{ position:fixed; inset:0; z-index:70; display:grid; place-items:start center; padding:8vh 16px 16px }
.modal .scrimx{ position:absolute; inset:0; background:var(--scrim); border:0; width:100%; height:100% }
.box{
  position:relative; width:100%; max-width:600px; max-height:84vh; overflow:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--pop);
}
.box.wide{ max-width:860px }

.pal{
  position:relative; width:100%; max-width:612px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--pop); overflow:hidden;
}

.pal input{
  flex:1 1 auto; min-width:0; height:34px; border:0; background:none; color:var(--tx);
  font:400 15px/1 var(--sans);
}
.pal input:focus{ outline:none }
.pal input::placeholder{ color:var(--tx-3) }
.pal .esc{
  font:500 var(--t-chip)/1 var(--sans); color:var(--tx-3); flex:none;
  border:1px solid var(--line); border-radius:5px; padding:4px 6px; background:var(--panel-2);
}
.pal .list{ max-height:min(52vh,420px); overflow:auto; padding:6px }
.pal .lab{ padding:9px 10px 5px; color:var(--tx-3); font:500 var(--t-meta)/1 var(--sans) }
.pal .it{
  display:flex; align-items:center; gap:10px; width:100%; padding:0 10px; height:38px;
  border-radius:var(--r-sm); color:var(--tx); font:400 var(--t-body)/1 var(--sans); text-align:left;
}
.pal .it:hover{ background:var(--raise); text-decoration:none }

.pal .it > svg:first-child{ color:var(--tx-3); flex:none }
.pal .it .nm{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.pal .it .pre{ font-family:var(--mono); color:var(--accent-tx); font-size:var(--t-meta); flex:none }
.pal .it .hint{ color:var(--tx-3); font-size:var(--t-meta); flex:none }
.pal .ft{
  display:flex; align-items:center; gap:14px; padding:9px 14px;
  border-top:1px solid var(--line); background:var(--panel-2);
  color:var(--tx-3); font-size:var(--t-meta);
}
.pal .ft kbd{
  font:500 10px/1 var(--sans); border:1px solid var(--line); border-radius:4px;
  padding:2px 4px; background:var(--panel); color:var(--tx-2);

   flex container turns each of them into its own column — the dash has to
   hang off a positioned pseudo-element instead.

   exists so no view has to override .notes' section gap inline. */
.notes li,.bullets li{
  color:var(--tx-2); font-size:var(--t-body); margin-bottom:6px;
  padding-left:19px; position:relative; line-height:1.55;
}

.bullets li:last-child{ margin-bottom:0 }
.bullets code{ color:var(--tx); background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:1px 4px }

.bullets li,.bullets p{ overflow-wrap:anywhere }
.notes code{ color:var(--tx); background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:1px 4px }

/* Reduced motion degrades to a settled, honest snapshot — the run
   finishes, the cursor stops, nothing merely runs faster. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{

.roadmap{

var SPAN = 44;               /* samples held per series */

function seedSeries(v, jitter){
  var a=[], x=v;
  for(var i=0;i<SPAN;i++){
    x = clamp(x + rnd(-jitter,jitter), 0, 100);
    a.push(x);
  }
  a[SPAN-1] = v;               /* end exactly on the mock number */
  return a;
}
function flatSeries(){
  var a=[];
  for(var i=0;i<SPAN;i++) a.push(0);
  return a;
}
function seedTelemetry(){
  D.servers.forEach(function(s){
    var m=null;
    for(var i=0;i<D.metrics.length;i++){ if(D.metrics[i].server===s.name) m=D.metrics[i]; }
    var live = s.status==="active";
    TEL.servers[s.id] = {
      live: live,
      dead: s.status==="unreachable",
      cpu: s.cpu, mem: s.mem, disk: s.disk,
      net: m ? costNum(m.net) : 0,
      spiky: s.type==="build",
      up: m ? m.up : "—",
      series: live ? seedSeries(s.cpu, 4) : flatSeries()
    };
  });
  TEL.svc = { reqs:412, p95:96, err:0.2, series:seedSeries(46,6) };
}
function stepServer(st){
  if(!st.live){ return; }
  var drift = st.spiky ? 9 : 3.4;
  st.cpu = clamp(st.cpu + rnd(-drift,drift) + (st.spiky && Math.random()<0.07 ? rnd(-22,22) : 0), 2, 98);
  st.mem = clamp(st.mem + rnd(-1.1,1.1), 4, 96);
  st.disk = clamp(st.disk + rnd(-0.12,0.14), 1, 99);
  st.net = clamp(st.net + rnd(-16,16), 4, 940);
  st.series.push(st.cpu);
  while(st.series.length>SPAN) st.series.shift();
}
function stepTelemetry(){
  TEL.tick++;
  for(var k in TEL.servers){ if(Object.prototype.hasOwnProperty.call(TEL.servers,k)) stepServer(TEL.servers[k]); }
  var s = TEL.svc;
  s.reqs = clamp(s.reqs + rnd(-26,26), 120, 900);
  s.p95  = clamp(s.p95 + rnd(-5,5), 42, 320);
  s.err  = clamp(s.err + rnd(-0.06,0.06), 0, 3.4);
  s.series.push(clamp(s.reqs/9, 0, 100));
  while(s.series.length>SPAN) s.series.shift();
}

/* ============================================================

   ============================================================ */

function navItem(it, cur){
  var on = it.go && it.go===cur;
  var kids = it.grp==="recents" ? RECENTS
           : it.grp==="projects" ? D.projects.map(function(p){ return { l:p.name, go:"project:"+p.id }; })
           : it.kids;
  var expandable = !!(kids && kids.length);
  var open = expandable && S.open[it.grp];
  /* A group that also has a destination of its own gets the chevron as
     its own control, so opening the group and going to the page are two
     different clicks — the reference makes the same split. */
  var out = "";
  if(expandable){
    var childOn = false;
    kids.forEach(function(k){ if(k.go===cur) childOn = true; });
    out += '<button class="navi" data-grp="'+esc(it.grp)+'" aria-expanded="'+(open?"true":"false")+'"'+
      (childOn && !open ? ' aria-current="page"' : "")+'>'+
      ic(it.i)+'<span class="lb">'+esc(it.l)+"</span>"+
      (it.tag?'<span class="tag">'+esc(it.tag)+"</span>":"")+
      '<span class="ch">'+ic("chevR",14)+"</span></button>";
    if(open){
      out += '<div class="navsub">';
      kids.forEach(function(k){
        out += '<button class="navi" data-go="'+esc(k.go)+'"'+(k.go===cur?' aria-current="page"':"")+'>'+
          ic("chevR",13)+'<span class="lb">'+esc(k.l)+"</span></button>";
      });
      out += "</div>";
    }
    return out;
  }
  return '<button class="navi" data-go="'+esc(it.go)+'"'+(on?' aria-current="page"':"")+'>'+
    ic(it.i)+'<span class="lb">'+esc(it.l)+"</span>"+
    (it.tag?'<span class="tag">'+esc(it.tag)+"</span>":"")+"</button>";
}

function renderRail(){
  var nav = scopeNav(), cur = activeGo(), exit = scopeExit(), out = "";
  if(exit){
    out += '<button class="backto" data-go="'+esc(exit.go)+'">'+ic("back",15)+
      '<span class="lb">'+esc(exit.l)+"</span></button>";
  }
  nav.forEach(function(it){
    if(it.lab){ out += '<div class="navlab">'+esc(it.lab)+"</div>"; return; }
    if(it.rule){ out += '<div class="railrule"></div>'; return; }

function menuAt(trigger, html, opts){
  opts = opts || {};
  var r = trigger.getBoundingClientRect();
  var w = opts.w || 224;
  var left = opts.align==="left" ? r.left : r.right - w;
  left = clamp(left, 8, Math.max(8, window.innerWidth - w - 8));
  return '<div class="pop"><button class="catch" data-menuclose="1" aria-label="Close menu"></button>'+
    '<div class="menu" role="menu" style="left:'+Math.round(left)+'px;top:'+Math.round(r.bottom+6)+
      'px;width:'+w+'px">'+html+"</div></div>";
}

    (opts.menu?' data-menu="'+esc(opts.menu)+'"':"")+
    (opts.theme?' data-theme-set="'+esc(opts.theme)+'"':"")+
    (opts.noop?' data-noop="1"':"")+
    (opts.on?' aria-pressed="true"':"")+

    (opts.i?ic(opts.i,15):"")+

    (opts.on?ic("check",14):"")+

}

   ------------------------------------------------------------
   The reference documents its prefixes in the palette itself
   (ask: access: aig: d1: …). Cloudgate's are below, and each one
   filters D rather than a hand-written list, so the palette can
   never offer something that is not really there.
   ============================================================ */

var PREFIXES = [
  { p:"srv",  i:"hdd",    d:"Search servers" },
  { p:"svc",  i:"box",    d:"Search services" },
  { p:"env",  i:"list",   d:"Search environments" },
  { p:"dep",  i:"rocket", d:"Search deployments" },
  { p:"run",  i:"layers", d:"Search Terraform runs" },
  { p:"acct", i:"cloud",  d:"Search cloud accounts" },
  { p:"go",   i:"search", d:"Jump to a page" }
];

var PAGES = [
  { l:"Organization home", go:"view:home",        i:"home" },
  { l:"Fleet",             go:"view:fleet",       i:"hdd" },
  { l:"Cloud accounts",    go:"view:accounts",    i:"cloud" },
  { l:"Provision a server",go:"view:provision",   i:"plus" },
  { l:"Terraform runs",    go:"view:runs",        i:"layers" },
  { l:"Deployments",       go:"view:deployments", i:"rocket" },
  { l:"Monitoring",        go:"view:monitoring",  i:"activity" },
  { l:"Projects",          go:"view:projects",    i:"folder" },
  { l:"Managed runtime",   go:"view:managed",     i:"layers" },
  { l:"Organization settings", go:"view:settings",i:"cog" }
];

function palSources(){
  var out = [];
  D.servers.forEach(function(s){
    out.push({ k:"srv", i:"hdd", nm:s.name, hint:locLine(s), go:"server:"+s.id });
  });
  for(var id in D.services){
    if(!Object.prototype.hasOwnProperty.call(D.services,id)) continue;
    var v = D.services[id];
    out.push({ k:"svc", i:v.kind==="application"?"box":"db", nm:v.name,
      hint:KIND_LABEL[v.kind]+" · "+v.env, go:"svc:"+id });
  }
  for(var eid in D.envs){
    if(!Object.prototype.hasOwnProperty.call(D.envs,eid)) continue;
    var e = D.envs[eid];
    out.push({ k:"env", i:"list", nm:e.project+" / "+e.name,
      hint:e.services+" services · "+e.vars+" variables", go:"env:"+eid });
  }
  D.deployments.forEach(function(d){
    out.push({ k:"dep", i:"rocket", nm:d.svc+" · "+d.desc, hint:d.status+" · "+d.at, go:"view:deployments" });
  });
  out.push({ k:"run", i:"layers", nm:D.run.id+" · "+D.run.server,
    hint:D.run.phase+" · "+PROVIDERS[D.run.provider].name, go:"server:srv-staging" });
  RUN_HISTORY.forEach(function(r){
    out.push({ k:"run", i:"layers", nm:r.id+" · "+or(svr(r.server)&&svr(r.server).name,r.server),
      hint:r.phase+" · "+r.at, go:"server:"+r.server });
  });
  D.accounts.forEach(function(a){
    out.push({ k:"acct", i:"cloud", nm:a.name, hint:PROVIDERS[a.provider].name+" · "+a.status, go:"view:accounts" });
  });
  PAGES.forEach(function(p){ out.push({ k:"go", i:p.i, nm:p.l, hint:"page", go:p.go }); });
  return out;
}

function palResults(q){
  q = String(q||"");
  var m = q.match(/^([a-z]+):\s*(.*)$/i), kind = null, term = q;
  if(m){
    for(var i=0;i<PREFIXES.length;i++){ if(PREFIXES[i].p===m[1].toLowerCase()) kind = PREFIXES[i].p; }
    if(kind) term = m[2];
  }
  term = term.trim().toLowerCase();
  var all = palSources(), out = [];
  all.forEach(function(r){
    if(kind && r.k!==kind) return;
    if(term && (r.nm+" "+r.hint).toLowerCase().indexOf(term)<0) return;
    out.push(r);
  });
  return out.slice(0, 40);
}

function renderPal(){
  if(S.pal===null) return "";
  var q = S.pal, res = palResults(q), out = "";
  if(!q){
    out += '<div class="lab">Search tips</div>';

      out += '<button class="it" data-palpre="'+esc(p.p)+'">'+ic(p.i,15)+
        '<span class="pre">'+esc(p.p)+":</span>"+

    out += '<div class="lab">Jump to</div>';

        '<span class="hint">page</span></button>';

  } else if(!res.length){
    out += '<div class="none">Nothing matches “'+esc(q)+'”. Try a prefix — <code>srv:</code>, <code>svc:</code>, <code>dep:</code>.</div>';
  } else {
    res.forEach(function(r,ix){

  }
  return '<div class="palwrap"><button class="scrimx" data-palclose="1" aria-label="Close search" '+
    'style="position:absolute;inset:0;background:var(--scrim);border:0;width:100%;height:100%"></button>'+
    '<div class="pal" role="dialog" aria-modal="true" aria-label="Search Cloudgate">'+
      '<div class="top">'+ic("search",17)+
        '<input id="palinp" type="text" autocomplete="off" spellcheck="false" '+
          'placeholder="Search servers, services, deployments and pages…" value="'+esc(q)+'">'+
        '<span class="esc">Esc</span></div>'+
      '<div class="list" id="pallist">'+out+"</div>"+
      '<div class="ft"><span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span>'+
        "<span><kbd>↵</kbd> to select</span>"+
        "<span><kbd>Esc</kbd> to dismiss</span></div>"+
    "</div></div>";
}

/* ---------- charts ----------
   The reference's chart is a number and a label on the left, a plot on
   the right, dashed horizontal gridlines, one thin line with a faint
   fill, and time ticks beneath. Painted from the live series by
   paintPlots(), so these are markup shells only. */

var TICKS = {
  "24h":["8 PM","12 AM","4 AM","8 AM","12 PM","4 PM"],
  "7d":["Fri","Sat","Sun","Mon","Tue","Wed","Thu"],
  "30d":["1 Jul","8 Jul","15 Jul","22 Jul","29 Jul"]
};
function plot(key, opts){
  opts = opts || {};
  var ticks = TICKS[S.span] || TICKS["24h"], t = "";
  ticks.forEach(function(x){ t += "<span>"+esc(x)+"</span>"; });
  return '<div class="plot" data-plot="'+esc(key)+'">'+
    '<div class="frame"><svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">'+
      '<g class="grid"><line x1="0" y1="1" x2="100" y2="1"/><line x1="0" y1="10.75" x2="100" y2="10.75"/>'+
      '<line x1="0" y1="20.5" x2="100" y2="20.5"/><line x1="0" y1="30.25" x2="100" y2="30.25"/>'+
      '<line x1="0" y1="40" x2="100" y2="40"/></g>'+
      '<polyline class="ar" points=""></polyline><polyline class="ln" points=""></polyline>'+
    "</svg></div>"+
    (opts.noticks?"":'<div class="ticks">'+t+"</div>")+"</div>";
}
function chart(label, valHTML, detail, key, opts){
  return '<div class="chart"><div class="side"><div class="lb">'+esc(label)+"</div>"+
    '<div class="vl">'+valHTML+"</div>"+
    (detail?'<div class="dl">'+detail+"</div>":"")+"</div>"+
    '<div class="plot-wrap" style="flex:1 1 auto;min-width:0">'+plot(key, opts)+"</div></div>";
}
function paintPlots(){
  var nodes = document.querySelectorAll("[data-plot]");
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i], ser = seriesFor(el.getAttribute("data-plot"));
    if(!ser || !ser.length) continue;
    var pts = [], n = ser.length;
    for(var j=0;j<n;j++){
      var x = (j/(n-1))*100, y = 39 - clamp(ser[j],0,100)/100*37.5;
      pts.push(x.toFixed(2)+","+y.toFixed(2));
    }
    var line = pts.join(" ");
    var ln = el.querySelector(".ln"), ar = el.querySelector(".ar");
    if(ln) ln.setAttribute("points", line);
    if(ar) ar.setAttribute("points", line+" 100,40 0,40");
    var st = TEL.servers[el.getAttribute("data-plot")];
    if(st){
      el.classList.toggle("mute", !st.live);
      el.classList.toggle("hot", !!st.live && st.cpu>82);
    }
  }
}

  var out = '<div class="seg" role="group" aria-label="Time range">';

/* A deployment row must land somewhere real. Two of the six name
   services that are not in D.services (admin-console, marketing-site),
   so those route to their environment instead of a dead service page. */
function depGo(d){
  for(var id in D.services){
    if(Object.prototype.hasOwnProperty.call(D.services,id) && D.services[id].name===d.svc) return "svc:"+id;
  }
  for(var eid in D.envs){
    if(!Object.prototype.hasOwnProperty.call(D.envs,eid)) continue;
    var e = D.envs[eid], p = proj(e.project);
    if(p && (p.name===d.project) && e.name===d.env) return "env:"+eid;
  }
  return "view:deployments";
}

  return "<th>"+hcell("Deployment",{sort:true})+"</th>"+

/* ---------- counts ----------
   Derived rather than written down, so a number on a summary tile cannot
   drift away from the data it claims to summarise. "yesterday" is the
   only relative stamp in D.deployments that is not today. */

function provisionedCount(){
  var n = 0;
  D.servers.forEach(function(s){ if(s.provenance==="provisioned") n++; });
  return n;
}
function serviceCount(){
  var n = 0;
  for(var k in D.envs){ if(Object.prototype.hasOwnProperty.call(D.envs,k)) n += D.envs[k].services; }
  return n;
}
function envCount(){
  var n = 0;
  for(var k in D.envs){ if(Object.prototype.hasOwnProperty.call(D.envs,k)) n++; }
  return n;
}
function depsToday(){
  var n = 0;
  D.deployments.forEach(function(d){ if(d.at.indexOf("yesterday")<0) n++; });
  return n;
}
function countStatus(st){
  var n = 0;
  D.deployments.forEach(function(d){ if(d.status===st) n++; });
  return n;
}

function spendBars(){
  var total = provisionedSpend(), out = "", segs = "";

    var pc = total ? (t/total)*100 : 0;
    segs += '<i style="width:'+pc.toFixed(1)+'%" data-p="'+esc(a.provider)+'" title="'+
      esc(a.name)+" — "+money(t)+'/mo"></i>';
    out += '<div class="r"><span class="k">'+pvMark(a.provider)+" "+esc(a.name)+"</span>"+
      '<span class="v mono">'+money(t)+"</span></div>";
  });
  return '<div class="mline"><span class="lb">Provisioned this month</span>'+
      '<span class="vl mono" data-num="g:spend">$0.00</span></div>'+
    '<div class="split">'+segs+"</div>"+
    '<div class="kv" style="margin-top:10px">'+out+"</div>";
}

/* ---------- screen 3 · the live Terraform run ----------
   The resource table and the outputs list change *during* the run, so
   they are built by their own functions and repainted in place by the
   ticker. Re-rendering the whole page every second instead would reset
   the log's scroll position, which is the one thing a person watching an
   apply is actually doing. */

function runResRows(){
  var out = "";
  RUN.resources.forEach(function(r){
    out += "<tr>"+
      '<td style="width:44px">'+gut(r.act)+"</td>"+
      '<td class="k mono" style="font-size:12px">'+esc(r.addr)+"</td>"+
      "<td>"+esc(cap(r.act))+"</td>"+
      "<td>"+pill(r.state==="done"?"done":r.state==="running"?"running":"planned")+"</td>"+
      '<td class="r mono">'+esc(or(r.took))+"</td></tr>";
  });
  return out;
}
function runOutRows(){
  var out = "";
  RUN.outputs.forEach(function(o){
    out += '<div class="r"><span class="k mono">'+esc(o.k)+"</span>"+
      '<span class="v mono" title="'+esc(o.v)+'">'+esc(o.v)+"</span></div>";
  });
  return out;
}
function repaintRun(){
  var res = document.getElementById("runresbody");
  if(res) res.innerHTML = runResRows();
  var outs = document.getElementById("runouts");
  if(outs) outs.innerHTML = runOutRows();
}

/* ---------- the notes drawer — this is the design document ---------- */

function overlayNotes(){
  return modal("Design notes — direction E, console",
    "Every prototype in this set carries its own notes drawer. This is the argument for this one, including where it disagrees with the brief.",
    '<div class="notes">'+

    "<section><h4>What this direction is</h4>"+
    "<p>A control plane, read from the Cloudflare dashboard and borrowed structurally rather than cosmetically. "+
    "Directions A–D all answer the brief with atmosphere — dim the room, add telemetry, make the surface feel like "+
    "equipment. E argues the other side: that a console earns the feeling of operating infrastructure by being "+
    "<em>navigable at scale</em>, and that legibility is what you are actually buying when you look at "+
    "infrastructure UI for eight hours.</p>"+
    "<p>The neutral ramp is lifted from the product's own <code>frontend/src/app/globals.css</code>, which — as it "+
    "turns out — is the same shadcn scale the reference is built on. The accent is the one invented value.</p></section>"+

    "<section><h4>Where this disagrees with BRIEF.md</h4>"+
    "<p>The brief records the client's rejection of an earlier prototype: <em>“the design is too simple i don't like "+
    "it… it should look like server kind working not simple saas product design.”</em> E is light, calm and "+
    "product-shaped, so on its face it walks back into the thing that was rejected. That is deliberate, and the "+
    "argument is this:</p>"+
    "<ul>"+
    "<li>The reference <em>is</em> an infrastructure console, not a SaaS app — and what makes it feel like one is "+
      "200-row tables, live telemetry rails, typed command search and a sidebar that changes identity as you "+
      "descend into a resource. None of that is simple.</li>"+
    "<li>What was rejected was probably <em>thinness</em> rather than <em>lightness</em>: a flat card grid with a "+
      "tidy accent and nothing on it. Density is the fix, and density does not require darkness.</li>"+
    "<li>E is a counter-proposal to react to, not a replacement for D. If it loses, it loses having made the "+
      "argument properly.</li>"+
    "</ul></section>"+

    "<section><h4>The signature: the rail is a scope, not a menu</h4>"+
    "<p>Entering a server, a project, an environment or a service replaces the entire rail with that resource's own "+
    "navigation, drops a <em>Back to …</em> pill above it, and rewrites the masthead to the resource's identity with "+
    "a switcher. Rail depth tracks Organization → Project → Environment → services, which is exactly the hierarchy "+
    "the brief asks these screens to express.</p>"+
    "<p>At a resource scope the rail items <em>are</em> the tabs — which is why no page in this prototype has a "+
    "second row of tabs under its heading. No other direction in the set does this; all four run one flat rail "+
    "across every view.</p>"+
    "<p>Second signature, and it genuinely works rather than being drawn: <code>⌘K</code> with typed prefixes — "+
    "<code>srv:</code> <code>svc:</code> <code>env:</code> <code>dep:</code> <code>run:</code> <code>acct:</code> "+
    "<code>go:</code> — filtering the real data object, so the palette can never offer something that is not there.</p></section>"+

    "<section><h4>New words this proposes</h4>"+
    "<ul>"+
    "<li><b>Origin</b> — <em>attached</em> (bring-your-own over SSH) or <em>provisioned</em> (Terraform-created). "+
      "The only difference between two servers in one list.</li>"+
    "<li><b>Cloud account</b> — an AWS, GCP or Azure account Cloudgate may act inside through a role you grant and "+
      "can revoke. The shared prerequisite for provisioning and for managed runtime.</li>"+
    "<li><b>Runtime</b> — <em>Server runtime</em> (Swarm + Traefik, works today) or <em>Managed runtime</em> "+
      "(native cloud services, roadmap). Set per environment, inherited by services, overridable per service.</li>"+
    "<li><b>Deploy target</b> — which server an environment's services land on.</li>"+
    "<li><b>Scope</b> — the console's own word for what the rail is currently showing. Interface vocabulary, not "+
      "domain vocabulary, and not proposed for the schema.</li>"+
    "</ul></section>"+

    "<section><h4>Proposed backend additions</h4>"+
    "<p>Marked on screen wherever they appear, with a <span class=\"pill t-warn\"><span class=\"g\">◐</span>P</span> "+
    "superscript or an inline note:</p>"+
    "<ul>"+
    "<li><code>serverStatus</code> gains <code>provisioning</code> and <code>unreachable</code>. Today the enum is "+
      "<code>active</code> / <code>inactive</code>, which cannot express a machine Terraform is still creating or "+
      "one that has stopped answering SSH.</li>"+
    "<li><code>server</code> gains <code>provenance</code>, <code>provider</code>, <code>region</code>, "+
      "<code>size</code>, <code>diskGb</code>, <code>instanceId</code>, <code>accountId</code>, <code>runId</code> "+
      "and <code>cost</code>. <code>POST /servers</code> takes only "+
      "<code>{name, ipAddress, port, username, sshKeyId, serverType}</code> today.</li>"+
    "<li><code>cloudAccount</code> is a new entity — provider, reference, granted-through, status, added-by.</li>"+
    "<li><code>terraformRun</code> is a new entity — phase, resources, log, outputs, drift, trigger.</li>"+
    "<li><code>environment.runtime</code> does not exist at all. Every environment is a server runtime whether it "+
      "says so or not.</li>"+
    "</ul></section>"+

    "<section><h4>What is deliberately absent, and what is weak</h4>"+
    "<ul>"+
    "<li><b>No canvas, no topology diagram.</b> D draws the fleet as a pannable map. E does not, because a table you "+
      "can sort, filter and scan is the honest answer at five servers and the only answer at fifty.</li>"+
    "<li><b>Managed runtime is drawn but inert.</b> Every control on that page is <code>aria-disabled</code>, and the "+
      "diagonal hatch is reserved to mean “does not exist yet” rather than “disabled for you”. Ordinary unwired "+
      "controls in this prototype are merely muted.</li>"+
    "<li><b>Ask is a facade.</b> It exists because the reference puts one in the same place, and the four questions "+
      "in it are the ones this data would actually be asked. It does not answer them.</li>"+
    "<li><b>The right rail is the weakest claim on screen.</b> Its usage meters, quick-action switches and "+
      "key-value cards are faithful to the reference, but several of them describe settings Cloudgate has no "+
      "endpoint for. They are proposals wearing the confidence of shipped features, and that is the thing to be "+
      "most sceptical about here.</li>"+
    "<li><b>Two deployment rows name services that are not in the data</b> — <code>admin-console</code> and "+
      "<code>marketing-site</code> exist in <code>D.deployments</code> but not in <code>D.services</code>. They "+
      "route to their environment instead of a dead service page, which is a patch over a gap in the mock data "+
      "rather than a design decision.</li>"+
    "</ul></section>"+

    "<section><h4>Palette and type</h4>"+
    "<p>Both palettes ship and every meaningful text pairing clears 4.5:1 in each. The switch is under "+
    "<em>Appearance</em> in the avatar menu, where the reference keeps it. It opens light, which is the point — "+
    "fifteen prototypes already open dark.</p>"+
    "<p>The accent is hue 285, indigo-violet. The product has no brand hue yet — <code>globals.css</code> is "+
    "achromatic apart from one sidebar token at hue 264 — so this is a <em>proposal</em>, held about 25° off the "+
    "reference's blue so the two do not read as the same product. Status colour is kept entirely separate from it, "+
    "and no status is ever carried by hue alone: every one pairs a glyph with its word.</p>"+
    "<p>No web fonts, because the brief forbids network requests. The system sans fills the role the reference gives "+
    "Inter; mono carries addresses, instance ids, Terraform resource addresses and commit shas, which is what the "+
    "reference uses it for too.</p></section>"+

    "<section><h4>Decisions this prototype is asking for</h4>"+
    "<ul>"+
    "<li>Is a scope-swapping rail the right model for Organization → Project → Environment → services, or is one "+
      "flat rail with breadcrumbs less disorienting?</li>"+
    "<li>Is light-first correct for a console people keep open all day, or does Cloudgate want to be a dark product?</li>"+
    "<li>Should provisioned and attached servers really stay one list, or does provisioning deserve its own surface?</li>"+
    "<li>Is showing managed runtime at all the right call, given nothing behind it is built?</li>"+
    "<li>Does hue 285 survive contact with the rest of the brand, or should the accent stay achromatic like the "+
      "current app?</li>"+
    "</ul></section>"+

    "</div>",
    '<span class="flex"></span><button class="btn pri" data-close="1">Close</button>', { wide:true });
}
