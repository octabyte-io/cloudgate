var timers = [];
function clearTimers(){
  timers.forEach(function(t){ clearInterval(t); });
  timers = [];
}

function tick(){
  if(TEL.paused) return;
  stepTelemetry();
  stepFleetSeries();
  paint();
  paintPlots();
}
function startTicker(){
  if(REDUCE || TEL.paused) return;
  timers.push(setInterval(tick, 1000));
}
function startRunLog(){
  if(REDUCE || RUN.finished || TEL.paused) return;
  timers.push(setInterval(function(){
    stepRun();
    var well = document.getElementById("runlog");
    if(well){
      var atBottom = well.scrollHeight - well.scrollTop - well.clientHeight < 40;
      well.innerHTML = logWell(RUN.log, { live:!RUN.finished, stamp:mmss(RUN.elapsed) })
        .replace(/^<div class="well"[^>]*>/,"").replace(/<\/div>$/,"");
      if(atBottom) well.scrollTop = well.scrollHeight;
    }
    paint();
    repaintRun();
    if(NEEDS_RENDER){ NEEDS_RENDER = false; render(); }
  }, 1000));
}
function startDeployLog(){
  if(REDUCE || TEL.paused) return;
  timers.push(setInterval(function(){
    if(DEPLOY_STEP >= DEPLOY_LOG.length) return;
    stepDeploy();
    var well = document.getElementById("deploylog");
    if(!well) return;
    var atBottom = well.scrollHeight - well.scrollTop - well.clientHeight < 40;
    well.innerHTML = logWell(DEPLOY_LOG.slice(0, DEPLOY_STEP),
      { live:DEPLOY_STEP < DEPLOY_LOG.length, stamp:"17:07:1"+(DEPLOY_STEP%10) })
      .replace(/^<div class="well"[^>]*>/,"").replace(/<\/div>$/,"");
    if(atBottom) well.scrollTop = well.scrollHeight;
  }, 1400));
}

function pageHTML(){
  if(S.scope!=="org" && SCOPE_VIEWS[S.scope]) return SCOPE_VIEWS[S.scope]();
  return (ORG_VIEWS[S.view] || viewHome)();
}

function render(){
  clearTimers();
  renderTop();
  renderRail();

  var main = document.getElementById("main");
  main.innerHTML = pageHTML();

  var ov = document.getElementById("overlay");
  ov.innerHTML = (S.pal!==null ? renderPal() : "") +
    (S.menu ? "" : "") +
    overlayHTML(S.overlay);
  if(S.menu && MENUS[S.menu]){
    var trig = document.querySelector('[data-menu="'+S.menu+'"]');
    if(!trig && S.menu==="appearance") trig = document.querySelector('[data-menu="avatar"]');
    if(trig){
      ov.innerHTML += MENUS[S.menu](trig);
      trig.setAttribute("aria-expanded","true");
    } else {
      S.menu = null;
    }
  }

  markInert();
  paint();
  paintPlots();
  startTicker();
  if(S.scope==="server" && S.serverTab==="infra") startRunLog();
  if(S.scope==="svc" && (S.svcTab==="overview" || S.svcTab==="deployments")) startDeployLog();

  var inp = document.getElementById("palinp");
  if(inp){
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
  } else if(S.overlay){
    var box = document.getElementById("modalbox");
    if(box && box.focus) box.focus();
  }
  if(!S.overlay && S.pal===null && !S.menu) main.scrollTop = 0;
  syncCrumb();
}

/* The masthead breadcrumb fades in once the page has scrolled — the
   reference's behaviour, and the reason .main owns scrolling rather
   than the document. */
function syncCrumb(){
  var c = document.getElementById("crumb"), m = document.getElementById("main");
  if(!c || !m) return;
  if(m.scrollTop > 40) c.classList.add("on"); else c.classList.remove("on");
}

function go(spec){
  var bits = String(spec).split(":"), kind = bits[0], id = bits.slice(1).join(":");

  if(kind==="view"){ S.scope="org"; S.view=id; S.overlay=null; if(id==="provision") S.step=1; }
  else if(kind==="scope"){ S.scope="org"; S.view="home"; S.overlay=null; }
  else if(kind==="server"){
    if(svr(id)) S.serverId=id;
    S.scope="server"; S.serverTab = svr(id) && svr(id).provenance==="provisioned" && svr(id).status==="provisioning"
      ? "infra" : "overview";
    S.overlay=null;
  }
  else if(kind==="srvtab"){ S.scope="server"; S.serverTab=id; S.overlay=null; }
  else if(kind==="project"){
    var p = proj(id);
    if(p){ S.projectId=id; S.envId = p.envs[0] || S.envId; }
    S.scope="project"; S.projTab="envs"; S.overlay=null;
  }
  else if(kind==="projtab"){ S.scope="project"; S.projTab=id; S.overlay=null; }
  else if(kind==="env"){
    if(D.envs[id]){ S.envId=id; S.projectId=D.envs[id].project; S.target.server=D.envs[id].target; }
    S.scope="env"; S.envTab="services"; S.overlay=null;
  }
  else if(kind==="envtab"){ S.scope="env"; S.envTab=id; S.overlay=null; }
  else if(kind==="svc"){
    if(D.services[id]){
      S.svcId=id; S.envId=D.services[id].env; S.projectId=D.envs[S.envId].project;
    }
    S.scope="svc"; S.svcTab="overview"; S.overlay=null;
  }
  else if(kind==="svctab"){ S.scope="svc"; S.svcTab=id; S.overlay=null; }
  else if(kind==="pause"){ TEL.paused = !TEL.paused; S.menu=null; }

  /* At drawer widths the rail is covering the thing you just asked for,
     so going somewhere is also closing it. */
  if(S.drawer && drawerMode()) setDrawer(0);
  S.pal = null;
  S.menu = null;
  render();
}

function openOverlay(spec, trigger){
  if(trigger){
    var sel = '[data-overlay="'+spec+'"]', all = document.querySelectorAll(sel), ix = 0;
    for(var i=0;i<all.length;i++){ if(all[i]===trigger) ix = i; }
    S.lastFocus = { sel:sel, ix:ix };
  }
  S.overlay = spec; S.menu = null; S.pal = null;
  render();
}
/* Focus restoration is a selector plus an index, not an element:
   render() rebuilds the page, so the node that opened the dialog is
   detached by the time the dialog closes. */
function closeOverlay(){
  var f = S.lastFocus;
  S.lastFocus = null; S.overlay = null;
  render();
  if(!f) return;
  var all = document.querySelectorAll(f.sel), el = all[f.ix] || all[0];
  if(el && el.focus) el.focus();
}

function openPal(){ S.pal = ""; S.palIx = 0; S.menu = null; render(); }
function closePal(){ S.pal = null; render(); }
function palMove(d){
  var items = document.querySelectorAll("#pallist [data-palix]");
  if(!items.length) return;
  S.palIx = clamp(S.palIx + d, 0, items.length-1);
  for(var i=0;i<items.length;i++){
    if(i===S.palIx){ items[i].setAttribute("data-cur","1"); items[i].scrollIntoView({ block:"nearest" }); }
    else items[i].removeAttribute("data-cur");
  }
}
function palEnter(){
  var items = document.querySelectorAll("#pallist [data-palix]");
  var el = items[S.palIx] || items[0];
  if(el){ go(el.getAttribute("data-go")); }
}

/* ============================================================
   events — one delegated listener
   ============================================================ */

document.addEventListener("click", function(e){
  var t;
  if(!e.target || !e.target.closest) return;

  if((t = e.target.closest("[data-menuclose]"))){ S.menu=null; render(); return; }
  if((t = e.target.closest("[data-palclose]"))){ closePal(); return; }
  if((t = e.target.closest("[data-close]"))){ closeOverlay(); return; }
  if((t = e.target.closest("[data-pal]"))){ openPal(); return; }
  if((t = e.target.closest("[data-palpre]"))){
    S.pal = t.getAttribute("data-palpre")+":"; S.palIx = 0; render(); return;
  }
  if((t = e.target.closest("[data-menu]"))){
    var m = t.getAttribute("data-menu");
    S.menu = (S.menu===m) ? null : m;
    S.overlay = null;
    render();
    return;
  }
  if((t = e.target.closest("[data-overlay]"))){ openOverlay(t.getAttribute("data-overlay"), t); return; }
  /* data-railbtn / data-drawerbtn rather than data-rail: <html> carries
     data-rail, and closest() walks all the way up to it, so every click
     in the page would match. */
  if((t = e.target.closest("[data-drawerbtn]"))){
    var dv = t.getAttribute("data-drawerbtn");
    setDrawer(dv==="t" ? !S.drawer : dv==="1");
    if(!S.drawer){ var nb = document.querySelector(".navtoggle"); if(nb && nb.focus) nb.focus(); }
    return;
  }
  if((t = e.target.closest("[data-railbtn]"))){
    if(drawerMode()) setDrawer(!S.drawer); else setRail(!S.rail);
    renderRail(); markInert();
    return;
  }
  if((t = e.target.closest("[data-theme-set]"))){
    setTheme(t.getAttribute("data-theme-set"));
    render();
    return;
  }
  if((t = e.target.closest("[data-grp]"))){
    var g = t.getAttribute("data-grp");
    S.open[g] = S.open[g] ? 0 : 1;
    renderRail(); markInert();
    return;
  }
  if((t = e.target.closest("[data-go]"))){ go(t.getAttribute("data-go")); return; }
  if((t = e.target.closest("[data-star]"))){
    var sid = t.getAttribute("data-star");
    S.starred[sid] = S.starred[sid] ? 0 : 1;
    render();
    return;
  }
  if((t = e.target.closest("[data-banner]"))){ S.banner = S.banner?0:1; render(); return; }
  if((t = e.target.closest("[data-span]"))){ S.span = t.getAttribute("data-span"); render(); return; }
  if((t = e.target.closest("[data-dep]"))){ S.depFilter = t.getAttribute("data-dep"); render(); return; }
  if((t = e.target.closest("[data-step]"))){ S.step = Number(t.getAttribute("data-step")); render(); return; }
  if((t = e.target.closest("[data-fleetq]"))){ S.fleetQ = t.getAttribute("data-fleetq"); render(); return; }
  if((t = e.target.closest("[data-tmode]"))){ S.target.mode = t.getAttribute("data-tmode"); render(); return; }
  if((t = e.target.closest("[data-target]"))){ S.target.server = t.getAttribute("data-target"); render(); return; }
  if((t = e.target.closest("[data-sw]"))){
    var on = t.getAttribute("aria-pressed")==="true";
    t.setAttribute("aria-pressed", on?"false":"true");
    return;
  }
  if((t = e.target.closest("[data-wiz]"))){
    var w = t.getAttribute("data-wiz").split(":");
    if(w[0]==="provider"){
      S.wiz.provider = w[1];
      var first = D.accounts.filter(function(a){ return a.provider===w[1]; })[0];
      S.wiz.account = first ? first.id : null;
      S.wiz.region = REGIONS[w[1]][0][0];
      S.wiz.size = SIZES[w[1]][1][0];
    } else if(w[0]==="role"){ /* deploy only, in this prototype */ }
    else { S.wiz[w[0]] = w[1]; }
    render();
    return;
  }
  if((t = e.target.closest(".cbox"))){
    t.setAttribute("aria-pressed", t.getAttribute("aria-pressed")==="true"?"false":"true");
    return;
  }
}, false);

document.addEventListener("input", function(e){
  if(!e.target) return;
  if(e.target.id==="palinp"){
    S.pal = e.target.value; S.palIx = 0;
    var list = document.getElementById("pallist");
    if(list){
      /* Repaint the list only — re-rendering would steal focus from the
         field the visitor is typing into. */
      var tmp = document.createElement("div");
      tmp.innerHTML = renderPal();
      var fresh = tmp.querySelector("#pallist");
      if(fresh){ list.innerHTML = fresh.innerHTML; markInert(); }
    }
    return;
  }
  if(e.target.id==="fleetq"){
    S.fleetQ = e.target.value;
    var main = document.getElementById("main"), pos = main.scrollTop;
    main.innerHTML = pageHTML();
    markInert(); paint(); paintPlots();
    main.scrollTop = pos;
    var again = document.getElementById("fleetq");
    if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    return;
  }
  if(e.target.getAttribute && e.target.getAttribute("data-wizname")==="1"){
    S.wiz.name = e.target.value;
    return;
  }
}, false);

document.addEventListener("keydown", function(e){
  var k = e.key;
  if((e.metaKey || e.ctrlKey) && (k==="k" || k==="K")){
    e.preventDefault();
    if(S.pal===null) openPal(); else closePal();
    return;
  }
  if(k==="/" && S.pal===null && !S.overlay &&
     e.target && e.target.tagName!=="INPUT" && e.target.tagName!=="TEXTAREA"){
    e.preventDefault(); openPal(); return;
  }
  if(S.pal!==null){
    if(k==="Escape"){ e.preventDefault(); closePal(); return; }
    if(k==="ArrowDown"){ e.preventDefault(); palMove(1); return; }
    if(k==="ArrowUp"){ e.preventDefault(); palMove(-1); return; }
    if(k==="Enter"){ e.preventDefault(); palEnter(); return; }
    return;
  }
  if(k==="Escape"){
    if(S.menu){ S.menu=null; render(); return; }
    if(S.overlay){ closeOverlay(); return; }
    if(S.drawer){ setDrawer(0); return; }
  }
}, false);

window.addEventListener("resize", function(){
  document.documentElement.setAttribute("data-rail", S.rail?"1":"0");
  if(!drawerMode() && S.drawer) setDrawer(0);
}, false);

/* ============================================================
   init
   ============================================================ */

(function init(){
  REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  setTheme(S.theme);
  setRail(S.rail);
  setDrawer(0);

  seedTelemetry();
  stepFleetSeries();
  initRun();
  if(REDUCE){ settleRunStatic(); settleDeployStatic(); TEL.paused = true; }

  render();

  var main = document.getElementById("main");
  if(main) main.addEventListener("scroll", syncCrumb, false);
})();
</script>
