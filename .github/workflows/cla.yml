# Asks each outside contributor, once, to agree to the contribution terms in
# CONTRIBUTING.md, and records who agreed. On a first pull request the bot
# comments with the sentence to reply; the reply is committed to
# signatures/contribution-terms.json on the `cla-signatures` branch, and the
# check stays red until then. A later pull request from the same person passes
# straight away.
#
# Signatures live on their own branch because the action commits to it, and a
# protected `main` would refuse that. The branch must exist before the first
# outside pull request: `git switch --orphan cla-signatures`, commit only a
# one-line README, push. It exists now; do not add branch protection to it.
#
# pull_request_target runs this workflow from the base branch with write
# access; that is safe here because no step checks out or runs the pull
# request's code.
name: contribution terms

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  terms:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the contribution terms in CONTRIBUTING.md and I agree to them'))
    steps:
      - name: Contribution terms agreed
        # contributor-assistant/github-action v2.6.1, pinned to its commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md#contribution-terms
          path-to-signatures: signatures/contribution-terms.json
          branch: cla-signatures
          # Maintainers and bots are not asked.
          allowlist: AxeemHaider,dependabot[bot],github-actions[bot],bot*
          custom-pr-sign-comment: I have read the contribution terms in CONTRIBUTING.md and I agree to them
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, please read the
            [contribution terms](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md#contribution-terms)
            and reply to this pull request with the sentence below. You only need to do this once.
          custom-allsigned-prcomment: Thanks, the contribution terms are agreed. A maintainer will review this soon.
          create-file-commit-message: Record agreements to the contribution terms
          signed-commit-message: $contributorName agreed to the contribution terms in $owner/$repo#$pullRequestNo
