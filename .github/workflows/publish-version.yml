# Publishes a Cloudgate version (ADR-0082; CONTEXT.md, Cloudgate version):
# the two tarballs the install downloads, linux-amd64 and linux-arm64, on the
# GitHub Release for its tag, once that tag's `E2E (release)` run is green.
#
#   1. `git tag v0.3.0 && git push origin v0.3.0` starts `E2E (release)`;
#   2. when that run ends green, this one checks the tag with
#      deploy/version-gate.sh and builds a tarball with
#      deploy/version-tarball.sh on each CPU, ubuntu-24.04 and
#      ubuntu-24.04-arm (node-pty is compiled natively there, against the
#      older of the two releases the install accepts), with the Node the
#      install puts on a box. The amd64 E2E run gates both: the code is the
#      same, only the compiled module differs (ADR-0088);
#   3. four clean runs, amd64 and arm64 on each of Ubuntu 24.04 and 26.04,
#      each check their CPU's tarball checksum, unpack it, migrate an empty
#      Postgres from it and boot the backend and the console from it
#      (deploy/version-smoke.sh), so each tarball is proved on both releases
#      the install accepts (ADR-0085). GitHub has no 26.04 Arm runner, so the
#      arm64 26.04 run is an `ubuntu:26.04` container on the Arm runner;
#   4. only when all four pass, deploy/version-sign.sh signs both .sha256
#      with the VERSION_SIGNING_KEY secret, checking each signature against
#      the key root install.sh trusts (ADR-0087), and
#      deploy/version-publish.sh creates the GitHub Release for the tag with
#      both tarballs, their .sha256 and their .sha256.sig, together;
#   5. and it dispatches `Deploy the Hosted instance` (deploy-hosted.yml) with
#      the tag and the commit E2E tested. That workflow cannot start from this
#      one's `workflow_run`: this run was itself started by `workflow_run`, so
#      its head_branch and head_sha are the default branch's, not the tag's.
#
# A red E2E run, a tag moved since the commit E2E tested, a tag that is not on
# main, or a tag that is not backend/package.json's version publishes nothing; so does a tarball that does
# not boot on one of the four runs. Re-running this workflow on a tag whose release already has its
# tarballs leaves that release as it is: a published version is never replaced.
# A release made by hand on github.com before this run gets the six files added.
#
# A release candidate, `vX.Y.Z-rc.N` (ADR-0094), goes through steps 1 to 4
# the same way and is published as a GitHub pre-release, its tarballs named
# X.Y.Z-rc.N. Step 5 is skipped: a release candidate never reaches the Hosted
# instance, and neither root install.sh nor the console's update check counts
# it as the latest version, so it is installed only on a box that names it
# (CLOUDGATE_VERSION=v0.3.0-rc.1). It becomes a version through **Promote
# release candidate** (promote-release-candidate.yml), which tags vX.Y.Z on
# the same commit and calls this workflow with that tag and the commit the
# candidate's E2E run tested, so a promoted version is built, booted, signed,
# published and deployed here without its tests running again.
#
# There is no workflow_dispatch: a version is published only from a green E2E
# run of its tag, or of the release candidate it was promoted from. To
# publish again after a failure, re-run this workflow's run.
name: Publish Cloudgate version

on:
  workflow_run:
    workflows: ['E2E (release)']
    types: [completed]
  # From promote-release-candidate.yml only, once it has checked the
  # candidate's E2E run and release.
  workflow_call:
    inputs:
      tag:
        description: The version tag to publish, vX.Y.Z, already on the tested commit
        required: true
        type: string
      tested_sha:
        description: The commit the release candidate's green E2E run tested
        required: true
        type: string
    secrets:
      VERSION_SIGNING_KEY:
        required: true

permissions:
  contents: read

# One publish per tag at a time, never cancelled half-way.
concurrency:
  group: publish-version-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # From E2E's run, or from the promotion that called this workflow.
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
  TESTED_SHA: ${{ inputs.tested_sha || github.event.workflow_run.head_sha }}

jobs:
  build:
    name: Build the ${{ matrix.cpu }} tarball
    # From E2E: only a green run on a pushed tag. deploy/version-gate.sh checks
    # the conclusion again, beside the tag. From a promotion: always, as the
    # promotion checked the candidate's green run before it called this.
    if: >-
      inputs.tag != '' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v'))
    # Natively on each CPU: pty.node runs only on the CPU it was compiled for.
    strategy:
      matrix:
        include:
          - cpu: amd64
            runner: ubuntu-24.04
          - cpu: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      # The same on both: it is read from deploy/install.sh at the tag.
      node: ${{ steps.node.outputs.version }}
    steps:
      # Before the tag is used anywhere.
      - name: The tag is a Cloudgate version or a release candidate
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::\"$TAG\" is not a Cloudgate version tag (vX.Y.Z, or vX.Y.Z-rc.N)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          # main's history too: deploy/version-gate.sh publishes only a tag on
          # origin/main.
          fetch-depth: 0

      # pty.node is built for one Node ABI: the one deploy/install.sh installs.
      - name: The Node the install puts on a box
        id: node
        run: |
          version="$(sed -n 's/^NODE_VERSION="${NODE_VERSION:-v\(.*\)}"$/\1/p' deploy/install.sh)"
          [ -n "$version" ] || { echo "::error::No NODE_VERSION default in deploy/install.sh."; exit 1; }
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      # No dependency cache: what goes into the tarball is built from a clean
      # install of the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: E2E passed on the commit the tag names, on main, at backend/package.json's version
        env:
          # A promotion is called only once the candidate's run is green.
          E2E_CONCLUSION: ${{ inputs.tag && 'success' || github.event.workflow_run.conclusion }}
        run: bash deploy/version-gate.sh "$TAG"

      - name: Build the ${{ matrix.cpu }} tarball
        run: |
          bash deploy/version-tarball.sh "$RUNNER_TEMP/version" "$TAG"
          # The script names it for the CPU it ran on; this is that CPU.
          test -f "$RUNNER_TEMP/version/cloudgate-${TAG#v}-linux-${{ matrix.cpu }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: cloudgate-version-${{ matrix.cpu }}
          path: ${{ runner.temp }}/version/
          if-no-files-found: error
          retention-days: 7
          # Already gzipped.
          compression-level: 0

  smoke:
    name: Unpack, migrate and boot the ${{ matrix.cpu }} tarball on Ubuntu ${{ matrix.release }}
    needs: build
    # A runner with nothing installed from the repository: only the tarball,
    # Node and an empty Postgres, as on a box after the install's other steps.
    # Each CPU on each Ubuntu release the install accepts (ADR-0085, ADR-0088);
    # publish needs every one of them green. GitHub has no 26.04 Arm runner, so
    # that one boots in an ubuntu:26.04 container on the 24.04 Arm runner, and
    # reaches Postgres by its service name rather than the runner's loopback.
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: amd64
            release: '24.04'
            runner: ubuntu-24.04
          - cpu: amd64
            release: '26.04'
            runner: ubuntu-26.04
          - cpu: arm64
            release: '24.04'
            runner: ubuntu-24.04-arm
          - cpu: arm64
            release: '26.04'
            runner: ubuntu-24.04-arm
            container: ubuntu:26.04
    runs-on: ${{ matrix.runner }}
    # An empty image runs the job on the runner itself.
    container: ${{ matrix.container || '' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudgate
          POSTGRES_PASSWORD: cloudgate
          POSTGRES_DB: cloudgate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cloudgate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # A bare ubuntu:26.04 image has neither curl, which the smoke script
      # asks the backend with, nor git, which a sparse checkout needs.
      - name: curl and git in the ubuntu:26.04 container
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      # The smoke script alone, not the tree: nothing else from the
      # repository is on this runner.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          sparse-checkout: deploy/version-smoke.sh
          sparse-checkout-cone-mode: false
          path: repository

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.build.outputs.node }}

      - uses: actions/download-artifact@v4
        with:
          name: cloudgate-version-${{ matrix.cpu }}
          # In the workspace rather than runner.temp, whose expression names
          # the runner's path even inside the container.
          path: version

      - name: Unpack, migrate and boot the ${{ matrix.cpu }} tarball
        env:
          DATABASE_URL: postgresql://cloudgate:cloudgate@${{ matrix.container && 'postgres' || '127.0.0.1' }}:5432/cloudgate
        run: |
          bash repository/deploy/version-smoke.sh \
            "$GITHUB_WORKSPACE/version/cloudgate-${TAG#v}-linux-${{ matrix.cpu }}.tar.gz" \
            "$GITHUB_WORKSPACE/cloudgate"

  publish:
    name: Publish the GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # Both CPUs' tarballs and checksums, side by side in one directory.
      - uses: actions/download-artifact@v4
        with:
          pattern: cloudgate-version-*
          merge-multiple: true
          path: ${{ runner.temp }}/version

      # With the key whose public half root install.sh carries, which refuses
      # a version whose signature does not verify (ADR-0087).
      - name: Sign both checksums
        env:
          VERSION_SIGNING_KEY: ${{ secrets.VERSION_SIGNING_KEY }}
        run: bash deploy/version-sign.sh "$TAG" "$RUNNER_TEMP/version"

      - name: The release for ${{ env.TAG }}, with both tarballs, their checksums and their signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/version-publish.sh "$TAG" "$RUNNER_TEMP/version"

  deploy-hosted:
    name: Start the Hosted instance's upgrade
    needs: publish
    # A release candidate is installed by hand on a test box, never here
    # (ADR-0094); promoting it publishes vX.Y.Z, which is.
    if: ${{ !contains(inputs.tag || github.event.workflow_run.head_branch, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # workflow_dispatch, which GITHUB_TOKEN may start
    steps:
      # On main, where the `hosted` environment allows deployments; the tag
      # and the tested commit travel as inputs, and deploy-hosted.yml checks
      # the tag still names that commit before it reaches the box.
      - name: Dispatch deploy-hosted.yml for ${{ env.TAG }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-hosted.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$TAG" -f tested_sha="$TESTED_SHA"
