# Upgrades the Hosted instance to a Cloudgate version once it is published
# (docs/deploy.md §11, Automatic updates; ADR-0081, ADR-0082):
#
#   1. `git tag v0.3.0 && git push origin v0.3.0` starts `E2E (release)`;
#   2. when that run ends green, `Publish Cloudgate version`
#      (publish-version.yml) builds the version's tarball and puts it on the
#      tag's GitHub Release;
#   3. its last job dispatches this workflow with the tag and the commit E2E
#      tested; this one checks the tag still names that commit and is on main,
#      checks the version with deploy/hosted-release-gate.sh, SSHes to the box
#      as cloudgate-deploy and runs deploy/hosted-update.sh there with the tag,
#      which installs the published tarball;
#   4. then it waits for https://<hostname>/backend/settings/about to report
#      the new version in hosted mode.
#
# A red E2E or publish run deploys nothing. A version whose CHANGELOG.md
# section asks for something on upgrade stops at the gate, naming it; do it,
# then run this workflow by hand with the tag and `manual_steps_done` ticked.
# Running it by hand is also how a version is deployed again: leave
# `tested_sha` empty, and the run checks instead that the tag's release has its
# tarball. The box installs only a published version, so a tag with no release
# is refused there too, before its backup, by hand or not.
#
# Why a dispatch and not `workflow_run` on the publish workflow: that workflow
# is itself started by `workflow_run`, so its run's head_branch and head_sha
# are the default branch's, never the tag's, and nothing here could tell which
# version to deploy. The publish workflow passes both explicitly instead;
# GITHUB_TOKEN may start a workflow_dispatch run, where it may not start most
# other events.
#
# Everything it needs is on the GitHub environment `hosted`: the secrets
# HOSTED_SSH_HOST, HOSTED_SSH_PRIVATE_KEY and HOSTED_SSH_KNOWN_HOSTS, and the
# variables HOSTED_URL and, when sshd is not on 22, HOSTED_SSH_PORT. Limit that
# environment's deployment branches to `main`: this workflow is dispatched on
# main (publish-version.yml passes --ref main), never on the tag. The Stripe, Resend and B2 secrets never
# come here; the box keeps them in /etc/default/cloudgate-hosted.
name: Deploy the Hosted instance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The Cloudgate version to deploy, such as v0.3.0
        required: true
        type: string
      tested_sha:
        description: The commit E2E tested and the version was published from; publish-version.yml passes it, leave empty by hand
        required: false
        type: string
        default: ''
      manual_steps_done:
        description: The version's "What to do on upgrade" steps are done; deploy anyway
        type: boolean
        default: false

permissions:
  contents: read

# One upgrade at a time, and never one cancelled half-way.
concurrency:
  group: deploy-hosted
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Upgrade the Hosted instance
    runs-on: ubuntu-latest
    environment: hosted
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
      TESTED_SHA: ${{ inputs.tested_sha }}
      MANUAL_STEPS_DONE: ${{ inputs.manual_steps_done }}
    steps:
      # Before the tag is used anywhere.
      - name: The tag is a Cloudgate version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$TAG\" is not a Cloudgate version tag (vX.Y.Z)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          # main's history too, for the check below.
          fetch-depth: 0

      # Only a tag on main is deployed (ADR-0081). The box used to check this
      # with its own checkout; it installs a published version now and has no
      # checkout to ask, so the check is made here, before the box is reached,
      # as deploy/version-gate.sh made it before the version was published
      # (ADR-0082).
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG ($(git rev-parse HEAD)) is not on main; only a tag on main is deployed."
            exit 1
          fi

      # From publish-version.yml: the commit E2E tested and the version was
      # published from is the one whose release gate is read, so a tag moved
      # since then is refused.
      - name: The tag still names the commit E2E tested
        if: env.TESTED_SHA != ''
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "::error::$TAG now names $(git rev-parse HEAD), but E2E tested and the version was published from $TESTED_SHA."
            exit 1
          fi

      # By hand, with no commit passed: the tag's release must already carry
      # its tarball, which only a green publish run puts there. The box refuses
      # a tag without one anyway; this says so before the gate and the SSH.
      - name: The tag's Cloudgate version is published
        if: env.TESTED_SHA == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="cloudgate-${TAG#v}-linux-amd64.tar.gz"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$tarball"; then
            echo "::error::$TAG has no published release with $tarball. Only a version Publish Cloudgate version has published is deployed."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The version asks for nothing on upgrade
        run: |
          status=0
          bash deploy/hosted-release-gate.sh "$TAG" || status=$?
          if [ "$status" -eq 3 ]; then
            if [ "$MANUAL_STEPS_DONE" = true ]; then
              echo "::notice::$TAG asks for steps on upgrade; manual_steps_done says they are done."
              exit 0
            fi
            echo "::error::$TAG asks for something on upgrade (above). Do it, then run this workflow by hand with the tag and manual_steps_done."
          fi
          exit "$status"

      - name: Upgrade the box over SSH
        env:
          SSH_HOST: ${{ secrets.HOSTED_SSH_HOST }}
          SSH_PORT: ${{ vars.HOSTED_SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.HOSTED_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTED_SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::HOSTED_${name#SSH_} is not set on the hosted environment. docs/deploy.md §11 says what it is."
              exit 1
            fi
          done
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cloudgate-deploy
          chmod 0600 ~/.ssh/cloudgate-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The box's forced command reads the tag as the whole command line.
          ssh -i ~/.ssh/cloudgate-deploy -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "cloudgate-deploy@$SSH_HOST" "$TAG"

      - name: The instance reports the new version
        env:
          HOSTED_URL: ${{ vars.HOSTED_URL }}
        run: |
          if [ -z "$HOSTED_URL" ]; then
            echo "::error::The HOSTED_URL variable is not set on the hosted environment."
            exit 1
          fi
          want="${TAG#v}"
          for _ in $(seq 1 30); do
            about="$(curl -fsS --max-time 10 "$HOSTED_URL/backend/settings/about" || true)"
            version="$(jq -r '.version // empty' <<< "$about" 2>/dev/null || true)"
            mode="$(jq -r '.mode // empty' <<< "$about" 2>/dev/null || true)"
            if [ "$version" = "$want" ] && [ "$mode" = hosted ]; then
              curl -fsS --max-time 10 "$HOSTED_URL/backend/settings/health"; echo
              echo "$HOSTED_URL runs $want in hosted mode ✅"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$HOSTED_URL reports version \"$version\" in mode \"$mode\" after 5 minutes, not $want in hosted mode."
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/cloudgate-deploy
